<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FORJA — Entrenamiento & Nutrición</title>
<style>
  :root{
    --bg:#0E0F11; --surface:#17191C; --surface2:#1F2226; --surface3:#282C31; --line:#2A2E33;
    --text:#F4F5F3; --muted:#8D939B; --primary:#C8FF4D; --danger:#FF5C6E; --success:#4DE28B; --info:#5BC0FF;
  }
  body[data-theme="light"]{
    --bg:#F3F4F1; --surface:#FFFFFF; --surface2:#EEF0EB; --surface3:#E2E5DE; --line:#D8DBD3;
    --text:#15171A; --muted:#5B6067; --primary:#3F7A1F;
  }
  body[data-theme="light"] .btn-primary, body[data-theme="light"] .chip.active, body[data-theme="light"] .subtabs button.active{ color:#fff; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:74px; min-height:100vh;}
  .wrap{max-width:480px; margin:0 auto; padding:14px 16px 8px;}
  h1,h2,h3{margin:0; font-weight:800; letter-spacing:-0.02em;}
  ::-webkit-scrollbar{display:none;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 16px 8px; max-width:480px; margin:0 auto; position:sticky; top:0; background:var(--bg); z-index:5;}
  .brand{font-size:19px; font-weight:800; letter-spacing:-0.03em;}
  .brand span{color:var(--primary);}
  .streak{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:4px;}
  .card{background:var(--surface); border-radius:10px; padding:16px; margin-bottom:12px; border:1px solid var(--line);}
  .card.accent{border-color:var(--primary); box-shadow:0 0 0 1px var(--primary) inset;}
  .card h3{font-size:12.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin-bottom:12px; font-weight:700;}
  .bignum{font-size:32px; font-weight:800; letter-spacing:-0.02em; font-variant-numeric:tabular-nums;}
  .bignum small{font-size:13px; color:var(--muted); font-weight:600;}
  .bar-row{margin-bottom:10px;}
  .bar-label{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px; color:var(--muted);}
  .bar-label b{color:var(--text); font-weight:700;}
  .bar-track{height:7px; background:var(--surface2); border-radius:20px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:20px; transition:width .3s;}
  input, select, textarea{width:100%; background:var(--surface2); border:1px solid var(--line); color:var(--text); padding:11px 12px; border-radius:8px; font-size:15px; margin-bottom:8px; font-family:inherit;}
  input:focus, select:focus{outline:none; border-color:var(--primary);}
  label{font-size:12px; color:var(--muted); display:block; margin-bottom:4px;}
  .row{display:flex; gap:8px;}
  .row > *{flex:1;}
  button{font-family:inherit; font-weight:700; font-size:14.5px; border:none; border-radius:8px; padding:12px 14px; cursor:pointer;}
  button:disabled{opacity:.35; pointer-events:none;}
  .btn-primary{background:var(--primary); color:#0E0F11; width:100%;}
  .btn-primary:active{opacity:.8;}
  .btn-ghost{background:var(--surface2); color:var(--text); border:1px solid var(--line);}
  .btn-sm{padding:7px 10px; font-size:12.5px;}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid var(--danger);}
  .btn-icon{width:auto; flex:0 0 auto;}
  .chips{display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;}
  .chip{flex:0 0 auto; background:var(--surface2); color:var(--muted); border:1px solid var(--line); border-radius:20px; padding:7px 13px; font-size:12.5px; font-weight:600; white-space:nowrap; cursor:pointer;}
  .chip.active{background:var(--primary); color:#0E0F11; border-color:var(--primary);}
  .ex-card{display:flex; gap:12px; align-items:center; padding:11px; background:var(--surface2); border-radius:10px; margin-bottom:8px; cursor:pointer; border:1px solid transparent;}
  .ex-card:active{border-color:var(--primary);}
  .ex-avatar{width:44px; height:44px; border-radius:8px; background:var(--surface3); display:flex; align-items:center; justify-content:center; font-size:18px; flex:0 0 auto;}
  .ex-info{flex:1; min-width:0;}
  .ex-name{font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ex-meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .ex-fav{color:var(--muted); font-size:18px; flex:0 0 auto; background:none; padding:4px;}
  .ex-fav.active{color:var(--primary);}
  .tag{display:inline-block; font-size:11px; padding:3px 9px; border-radius:20px; background:var(--surface3); color:var(--muted); margin:0 5px 5px 0;}
  .tag.primary{background:var(--primary); color:#0E0F11;}
  .gif-box{width:100%; aspect-ratio:1/1; max-height:280px; background:var(--surface2); border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:12px; overflow:hidden;}
  .gif-box img{width:100%; height:100%; object-fit:contain;}
  .gif-box .placeholder{color:var(--muted); font-size:12.5px; text-align:center; padding:20px;}
  .subtabs{display:flex; gap:6px; margin-bottom:14px;}
  .subtabs button{flex:1; background:var(--surface2); color:var(--muted); border:1px solid var(--line);}
  .subtabs button.active{background:var(--primary); color:#0E0F11; border-color:var(--primary);}
  .meal-item{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .meal-item:last-child{border-bottom:none;}
  .meal-item .macros{font-size:11.5px; color:var(--muted);}
  .food-result{padding:10px; border-bottom:1px solid var(--line); cursor:pointer;}
  .food-result:active{background:var(--surface2);}
  .food-result .fname{font-size:14px; font-weight:600;}
  .food-result .fmacros{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .empty{color:var(--muted); font-size:13.5px; text-align:center; padding:22px 10px;}
  .empty .big{font-size:26px; margin-bottom:6px;}
  .chart-wrap{width:100%; overflow-x:auto;}
  .divider{height:1px; background:var(--line); margin:14px 0;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .backbtn{background:none; color:var(--muted); font-size:13px; padding:6px 0; margin-bottom:6px;}
  .step{font-size:13.5px; line-height:1.5; margin-bottom:8px; padding-left:18px; position:relative;}
  .step::before{content:"•"; position:absolute; left:2px; color:var(--primary);}
  .bottomnav{position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--line); display:flex; z-index:10;}
  .bottomnav button{flex:1; background:none; border:none; border-radius:0; color:var(--muted); padding:10px 2px 8px; font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:3px;}
  .bottomnav button.active{color:var(--primary);}
  .bottomnav svg{width:19px; height:19px;}
  .badge-soon{font-size:9px; background:var(--surface3); color:var(--muted); padding:1px 6px; border-radius:10px; margin-left:5px;}
  .day-block{background:var(--surface2); border-radius:10px; padding:10px 12px; margin-bottom:10px;}
  .day-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:14px; gap:8px;}
  .exrow-mini{display:flex; justify-content:space-between; align-items:center; gap:6px; font-size:13px; padding:6px 0; border-bottom:1px solid var(--line);}
  .exrow-mini:last-child{border-bottom:none;}
  .exrow-mini input{width:60px; margin-bottom:0; padding:6px 8px; font-size:13px;}
</style>
</head>

<script>
/* =====================================================================
   FORJA — Fase 1 + 2 + 3 + 4 + 5 (rutinas, generador, modo entrenamiento,

const DEFAULT_PERFIL = { peso_inicial: 96, altura: 192, edad: 19, fecha_inicio: new Date().toISOString().slice(0,10), kcal: 2200, prot: 210, carb: 170, grasa: 75 };

const EJERCICIOS = [
  {id:'pec01', nombre:'Press banca con barra', grupo:'pecho', secundarios:['tríceps','hombro anterior'], equipo:'Barra', patron:'Empuje horizontal', dificultad:'Intermedio', pasos:['Acostate en el banco con los pies firmes en el piso.','Agarrá la barra un poco más ancho que los hombros y bajala controlada al pecho.','Empujá hasta extender los brazos sin trabar los codos de golpe.'], errores:['Rebotar la barra en el pecho.','Levantar la cadera del banco.'], consejos:['Retraé las escápulas antes de empezar.','Controlá más la bajada que la subida.'], variantes:['Press banca mancuernas','Press inclinado barra','Press en Smith']},
  {id:'pec02', nombre:'Press banca con mancuernas', grupo:'pecho', secundarios:['tríceps','hombro anterior'], equipo:'Mancuernas', patron:'Empuje horizontal', dificultad:'Intermedio', pasos:['Sentate con una mancuerna en cada muslo y recostate llevándolas al pecho.','Empujá ambas mancuernas hacia arriba sin chocarlas.','Bajá controlado hasta sentir estiramiento en el pecho.'], errores:['Abrir demasiado los codos.','Usar rango muy corto.'], consejos:['Mayor rango de movimiento que con barra.','Girá levemente las muñecas arriba para contraer mejor.'], variantes:['Press banca barra','Press inclinado mancuernas']},
  {id:'pec03', nombre:'Press inclinado con barra', grupo:'pecho', secundarios:['hombro anterior','tríceps'], equipo:'Barra', patron:'Empuje horizontal', dificultad:'Intermedio', pasos:['Ajustá el banco a 30-45°.','Bajá la barra a la parte alta del pecho.','Empujá hacia arriba y levemente atrás.'], errores:['Inclinar el banco demasiado.','Bajar la barra al cuello.'], consejos:['30° es suficiente para enfatizar pecho alto.'], variantes:['Press inclinado mancuernas','Press declinado']},
  {id:'pec04', nombre:'Press inclinado con mancuernas', grupo:'pecho', secundarios:['hombro anterior','tríceps'], equipo:'Mancuernas', patron:'Empuje horizontal', dificultad:'Intermedio', pasos:['Banco a 30°, mancuernas a la altura del pecho alto.','Empujá hacia arriba juntando las mancuernas arriba.','Bajá controlado.'], errores:['Perder el arco natural de la muñeca.'], consejos:['Buena opción para asimetrías entre lados.'], variantes:['Press inclinado barra']},
  {id:'pec05', nombre:'Press declinado con barra', grupo:'pecho', secundarios:['tríceps'], equipo:'Barra', patron:'Empuje horizontal', dificultad:'Intermedio', pasos:['Asegurá las piernas en el banco declinado.','Bajá la barra a la parte baja del pecho.','Empujá hacia arriba.'], errores:['Rango de movimiento incompleto.'], consejos:['Enfatiza la porción inferior del pectoral.'], variantes:['Press banca plano','Fondos en paralelas']},
  {id:'pec06', nombre:'Press en máquina (Chest Press)', grupo:'pecho', secundarios:['tríceps'], equipo:'Máquina', patron:'Empuje horizontal', dificultad:'Principiante', pasos:['Ajustá el asiento a la altura del pecho.','Empujá las manijas hacia adelante sin trabar codos.','Volvé controlado.'], errores:['Asiento mal ajustado castiga el hombro.'], consejos:['Ideal para aprender el patrón sin estabilizar peso libre.'], variantes:['Press convergente','Press banca']},
  {id:'pec07', nombre:'Press convergente (Hammer Strength)', grupo:'pecho', secundarios:['tríceps'], equipo:'Máquina', patron:'Empuje horizontal', dificultad:'Principiante', pasos:['Sentate y agarrá las manijas convergentes.','Empujá al frente juntando el recorrido.','Volvé controlado sin soltar tensión.'], errores:['Usar demasiado peso y perder rango.'], consejos:['Buena para volumen al final del entreno.'], variantes:['Press en máquina','Press banca']},
  {id:'pec08', nombre:'Aperturas con mancuernas', grupo:'pecho', secundarios:[], equipo:'Mancuernas', patron:'Aducción horizontal', dificultad:'Intermedio', pasos:['Acostate con mancuernas arriba del pecho, codos con leve flexión fija.','Abrí los brazos en arco hasta sentir estiramiento.','Cerrá volviendo a la posición inicial.'], errores:['Flexionar y extender el codo.','Usar demasiado peso.'], consejos:['Es un ejercicio de aislamiento, priorizá técnica sobre carga.'], variantes:['Aperturas en máquina','Cruce de poleas']},
  {id:'pec09', nombre:'Aperturas en máquina (Pec Deck)', grupo:'pecho', secundarios:[], equipo:'Máquina', patron:'Aducción horizontal', dificultad:'Principiante', pasos:['Ajustá el asiento para que las manijas queden a la altura del pecho.','Juntá los brazos al frente contrayendo el pecho.','Volvé controlado.'], errores:['Rebotar en la posición final.'], consejos:['Buena para el final del entreno.'], variantes:['Aperturas mancuernas','Cruce de poleas']},
  {id:'pec10', nombre:'Cruce de poleas (Cable Crossover)', grupo:'pecho', secundarios:[], equipo:'Poleas', patron:'Aducción horizontal', dificultad:'Intermedio', pasos:['Poleas altas, un paso adelante en posición de tijera.','Llevá las manos al frente y abajo cruzando levemente.','Volvé controlado sin perder tensión en el cable.'], errores:['Usar solo los brazos sin involucrar el pecho.'], consejos:['Cambiá la altura de la polea para enfatizar distintas fibras.'], variantes:['Aperturas mancuernas','Aperturas en máquina']},
  {id:'pec11', nombre:'Fondos en paralelas (pecho)', grupo:'pecho', secundarios:['tríceps'], equipo:'Peso corporal', patron:'Empuje horizontal', dificultad:'Avanzado', pasos:['Sostenete en las paralelas con el torso inclinado adelante.','Bajá flexionando los codos hasta sentir estiramiento en el pecho.','Empujá hacia arriba.'], errores:['Bajar demasiado y sobrecargar el hombro.'], consejos:['Inclinar el torso adelante enfatiza más pecho que tríceps.'], variantes:['Press declinado','Flexiones']},
  {id:'pec12', nombre:'Flexiones de brazos', grupo:'pecho', secundarios:['tríceps','core'], equipo:'Peso corporal', patron:'Empuje horizontal', dificultad:'Principiante', pasos:['Manos un poco más anchas que los hombros, cuerpo en línea recta.','Bajá el pecho cerca del piso.','Empujá hasta extender los brazos.'], errores:['Cadera caída o elevada.'], consejos:['Elevá los pies para aumentar dificultad.'], variantes:['Press banca','Fondos']},
  {id:'esp01', nombre:'Dominadas', grupo:'espalda', secundarios:['bíceps'], equipo:'Peso corporal', patron:'Tracción vertical', dificultad:'Avanzado', pasos:['Colgate de la barra con agarre prono, un poco más ancho que los hombros.','Tirá hacia arriba hasta que el mentón pase la barra.','Bajá controlado hasta extensión completa.'], errores:['Usar impulso de las piernas.','Rango incompleto.'], consejos:['Si no llegás a hacer una, usá banda elástica de asistencia.'], variantes:['Jalón al pecho','Dominadas supinas']},
  {id:'esp02', nombre:'Dominadas supinas (Chin-up)', grupo:'espalda', secundarios:['bíceps'], equipo:'Peso corporal', patron:'Tracción vertical', dificultad:'Avanzado', pasos:['Agarre supino, manos al ancho de los hombros.','Tirá hacia arriba llevando el pecho a la barra.','Bajá controlado.'], errores:['No extender completo abajo.'], consejos:['Involucra más bíceps que la dominada prona.'], variantes:['Dominadas','Jalón agarre cerrado']},
  {id:'esp03', nombre:'Jalón al pecho (Lat pulldown)', grupo:'espalda', secundarios:['bíceps'], equipo:'Poleas', patron:'Tracción vertical', dificultad:'Principiante', pasos:['Sentate y ajustá las rodilleras.','Tirá la barra hacia el pecho llevando los codos abajo y atrás.','Volvé controlado sin soltar tensión.'], errores:['Usar impulso hacia atrás con el torso.'], consejos:['Pensá en llevar los codos a los bolsillos.'], variantes:['Dominadas','Jalón tras nuca']},
  {id:'esp04', nombre:'Jalón tras nuca', grupo:'espalda', secundarios:['bíceps'], equipo:'Poleas', patron:'Tracción vertical', dificultad:'Intermedio', pasos:['Agarre ancho, barra detrás de la cabeza.','Tirá controlado hasta la nuca.','Volvé sin perder tensión.'], errores:['Forzar el cuello adelante.'], consejos:['Requiere buena movilidad de hombro.'], variantes:['Jalón al pecho']},
  {id:'esp05', nombre:'Jalón agarre cerrado', grupo:'espalda', secundarios:['bíceps'], equipo:'Poleas', patron:'Tracción vertical', dificultad:'Principiante', pasos:['Agarre en V o cerrado, tirá hacia el pecho.','Contraé la espalda arriba.','Volvé controlado.'], errores:['Balancearse hacia atrás.'], consejos:['Buena variante para enfatizar dorsal bajo.'], variantes:['Jalón al pecho','Remo en polea']},
  {id:'esp06', nombre:'Remo con barra', grupo:'espalda', secundarios:['bíceps','trapecios'], equipo:'Barra', patron:'Tracción horizontal', dificultad:'Intermedio', pasos:['Flexioná caderas manteniendo la espalda recta, barra colgando.','Tirá la barra hacia el abdomen.','Bajá controlado sin perder la posición de espalda.'], errores:['Redondear la espalda baja.','Usar impulso con rebote.'], consejos:['Mantené el pecho apuntando al piso.'], variantes:['Remo Pendlay','Remo T','Remo mancuerna']},
  {id:'esp07', nombre:'Remo con mancuerna a un brazo', grupo:'espalda', secundarios:['bíceps'], equipo:'Mancuernas', patron:'Tracción horizontal', dificultad:'Principiante', pasos:['Apoyá una rodilla y mano en el banco, espalda paralela al piso.','Tirá la mancuerna hacia la cadera.','Bajá controlado.'], errores:['Rotar el torso para ayudarse.'], consejos:['Buena para corregir asimetrías entre lados.'], variantes:['Remo con barra','Remo en polea']},
  {id:'esp08', nombre:'Remo en máquina sentado (Seated Row)', grupo:'espalda', secundarios:['bíceps'], equipo:'Máquina', patron:'Tracción horizontal', dificultad:'Principiante', pasos:['Sentate con el pecho apoyado o espalda recta según la máquina.','Tirá las manijas hacia el abdomen.','Volvé controlado estirando bien adelante.'], errores:['Encorvar la espalda al final del recorrido.'], consejos:['Pausa de un segundo en la contracción.'], variantes:['Remo en polea baja','Remo con barra']},
  {id:'esp09', nombre:'Remo en polea baja', grupo:'espalda', secundarios:['bíceps'], equipo:'Poleas', patron:'Tracción horizontal', dificultad:'Principiante', pasos:['Sentate con las rodillas semi flexionadas, agarrá la manija.','Tirá hacia el abdomen manteniendo el torso estable.','Volvé controlado.'], errores:['Balancear el torso adelante y atrás.'], consejos:['Fijá la posición de la espalda antes de tirar.'], variantes:['Remo en máquina','Remo con barra']},
  {id:'esp10', nombre:'Remo T (T-bar row)', grupo:'espalda', secundarios:['bíceps','trapecios'], equipo:'Barra', patron:'Tracción horizontal', dificultad:'Intermedio', pasos:['Colocate sobre la barra con el torso inclinado.','Tirá el peso hacia el pecho/abdomen.','Bajá controlado.'], errores:['Perder la posición neutra de columna.'], consejos:['Permite cargar bastante peso con buen soporte del torso.'], variantes:['Remo con barra','Remo mancuerna']},
  {id:'esp11', nombre:'Peso muerto convencional', grupo:'espalda', secundarios:['isquios','trapecios','antebrazos'], equipo:'Barra', patron:'Bisagra de cadera', dificultad:'Avanzado', pasos:['Parate con la barra pegada a las espinillas, agarre firme.','Empujá el piso con las piernas mientras la espalda se mantiene recta.','Extendé cadera y rodillas hasta estar de pie.'], errores:['Redondear la espalda baja.','Alejar la barra del cuerpo.'], consejos:['Pensá en empujar el piso más que en levantar la barra.'], variantes:['Peso muerto rumano','Remo con barra']},

// ---------- STORAGE ----------
async function getKey(key){ try{ const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; } catch(e){ return null; } }
async function setKey(key, value){ try{ await window.storage.set(key, JSON.stringify(value)); } catch(e){ console.error('storage set fail', key, e); } }
async function loadPerfil(){ const p = await getKey('perfil'); perfil = p || DEFAULT_PERFIL; if(!p) await setKey('perfil', perfil); }
async function loadFavoritos(){ favoritos = (await getKey('favoritos_ejercicios')) || []; }
async function toggleFavorito(id){ if(favoritos.includes(id)) favoritos = favoritos.filter(f=>f!==id); else favoritos.push(id); await setKey('favoritos_ejercicios', favoritos); }
async function loadDia(date){ return (await getKey('dia:'+date)) || {comidas:[], peso:null}; }
async function saveDia(date, data){ await setKey('dia:'+date, data); }
async function loadAllPesos(){
  try{ const list = await window.storage.list('dia:'); if(!list || !list.keys) return [];
    const out = []; for(const k of list.keys){ const d = await getKey(k); if(d && d.peso){ out.push({fecha:k.replace('dia:',''), peso:d.peso}); } }
    return out.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  }catch(e){ return []; }
}
async function cargarSesiones(){
  try{ const list = await window.storage.list('sesion:'); if(!list || !list.keys) return [];
    const out = []; for(const k of list.keys){ const s = await getKey(k); if(s) out.push(s); }
    return out.sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
  }catch(e){ return []; }
}

// ---------- GIF (ExerciseDB OSS, gratis, sin key) ----------
const gifCache = {};
async function getExerciseGif(nombreEs){
  if(gifCache[nombreEs] !== undefined) return gifCache[nombreEs];
  const nombreEn = TRADUCCION_GIF[nombreEs] || nombreEs;
  try{
    const res = await fetch(`https://oss.exercisedb.dev/api/v1/exercises/search?q=${encodeURIComponent(nombreEn)}&limit=1`);
    const data = await res.json();
    const item = (data.data && data.data[0]) || (data.exercises && data.exercises[0]) || (Array.isArray(data) && data[0]) || null;
    const url = item ? (item.gifUrl || item.gif_url || null) : null;
    gifCache[nombreEs] = url; return url;
  }catch(e){ gifCache[nombreEs] = null; return null; }
}
function fmtDate(d){ const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('es-AR',{day:'2-digit',month:'short'}); }
function listaFiltrada(){
  return EJERCICIOS.filter(e=>{
    const okGrupo = filtroGrupo==='todos' || e.grupo===filtroGrupo;
    const okBusqueda = !busquedaEjercicio || e.nombre.toLowerCase().includes(busquedaEjercicio.toLowerCase());
    return okGrupo && okBusqueda;
  });
}

}

// ---------- INICIO ----------
async function calcularRacha(){
  const sesiones = await cargarSesiones();
  const fechas = new Set(sesiones.map(s=>s.fecha));
  let racha=0; let cursor=new Date(today);
  while(true){ const key = cursor.toISOString().slice(0,10); if(fechas.has(key)){ racha++; cursor.setDate(cursor.getDate()-1); } else break; }
  const semana=[]; const nombresDias=['D','L','M','X','J','V','S'];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const key=d.toISOString().slice(0,10); semana.push({dia:nombresDias[d.getDay()], hecho: fechas.has(key)}); }
  return {racha, semana};
}
async function renderInicio(){
  const dia = await loadDia(today);
  const tot = dia.comidas.reduce((a,c)=>({kcal:a.kcal+c.kcal, prot:a.prot+c.prot}), {kcal:0,prot:0});
  const {racha, semana} = await calcularRacha();
  const rutinas = (await getKey('rutinas')) || [];
  return `
    <div class="card accent">
      <h3>Hoy</h3>
      <div class="bignum">${Math.round(tot.kcal)} <small>/ ${perfil.kcal} kcal</small></div>
      <div class="bar-track" style="margin:8px 0 12px;"><div class="bar-fill" style="width:${Math.min(100,tot.kcal/perfil.kcal*100)}%; background:var(--primary);"></div></div>
      <div class="bar-label"><span>Proteína</span><b>${Math.round(tot.prot)}g / ${perfil.prot}g</b></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,tot.prot/perfil.prot*100)}%; background:var(--info);"></div></div>
    </div>
    <div class="card">
      <h3>Racha</h3>
      <div class="bignum">🔥 ${racha} <small>día${racha===1?'':'s'} seguidos</small></div>
      <div class="row" style="margin-top:10px;">${semana.map(d=>`<div style="text-align:center; flex:1;"><div class="ex-meta">${d.dia}</div><div style="font-size:16px;">${d.hecho?'✅':'▫️'}</div></div>`).join('')}</div>
    </div>
    <div class="card">
      <h3>Tus rutinas</h3>
      ${rutinas.length===0 ? '<div class="empty">Todavía no armaste una rutina</div>' : rutinas.slice(0,3).map(r=>`<div class="exrow-mini"><span>${r.nombre}</span><span class="ex-meta">${r.dias.length} días</span></div>`).join('')}
      <button class="btn-primary" style="margin-top:8px;" id="irRutinas">Ir a Entrenar</button>
    </div>
  `;
}

function generarRutina({dias, objetivo, nivel, duracion, prioridad}){
  const repsPorObjetivo = {fuerza:'4x5', masa:'4x10', recomp:'3x12'};
  const exPorDia = {30:3,45:4,60:5,75:6,90:7}[duracion] || 5;
  const diasArr = [];
  for(let i=0;i<dias;i++){
    const esEmpuje = i%2===0;
    const gruposDia = esEmpuje ? ['pecho','triceps'] : ['espalda','biceps'];
    let pool = EJERCICIOS.filter(e=>gruposDia.includes(e.grupo));
    if(prioridad && prioridad!=='ninguna'){ const extra = EJERCICIOS.filter(e=>e.grupo===prioridad); pool = extra.concat(pool); }
    const elegidos = pool.slice(0, exPorDia);
    diasArr.push({ nombre: (esEmpuje?'Empuje ':'Tirón ') + (Math.floor(i/2)+1), ejercicios: elegidos.map(e=>({exId:e.id, target: repsPorObjetivo[objetivo] || '3x10'})) });
  }
  return {id:'gen_'+Date.now(), nombre:`Rutina generada · ${dias} días · ${objetivo}`, dias:diasArr};
}

async function calcularHistorialPrevio(exIds){
  const sesiones = await cargarSesiones();
  const map = {};
  sesiones.forEach(s=> (s.ejercicios||[]).forEach(e=>{
    if(!exIds.includes(e.exId)) return;
    const maxSet = e.sets.reduce((m,st)=> (st.kg*st.reps > m.kg*m.reps ? st : m), {kg:0,reps:0});
    if(!map[e.exId] || maxSet.kg > map[e.exId].kg) map[e.exId] = maxSet;
  }));
  return map;
}
async function iniciarEntrenamiento(rutina, diaIdx){
  const dia = rutina.dias[diaIdx];
  const exIds = dia.ejercicios.map(e=>e.exId);
  const historialPrevio = await calcularHistorialPrevio(exIds);
  sessionState = { rutinaNombre: rutina.nombre, diaNombre: dia.nombre, inicio: Date.now(), descansoSeg:90, descansoRestante:0, descansoInterval:null, idx:0, historialPrevio,
    ejercicios: dia.ejercicios.map(ex=>{ const info=EJERCICIOS.find(e=>e.id===ex.exId); return {exId:ex.exId, nombre: info?info.nombre:ex.exId, target: ex.target, sets:[]}; }) };
  currentTab='entrenar'; ejercicioAbierto=null;
  await render();
}
function actualizarDescanso(){ if(!sessionState) return; const el=document.getElementById('descansoDisplay'); if(!el) return; el.textContent = sessionState.descansoRestante>0 ? sessionState.descansoRestante+'s' : '—'; }
function iniciarDescanso(seg){
  sessionState.descansoSeg = seg; sessionState.descansoRestante = seg;
  if(sessionState.descansoInterval) clearInterval(sessionState.descansoInterval);
  sessionState.descansoInterval = setInterval(()=>{
    if(!sessionState){ return; }
    sessionState.descansoRestante--; actualizarDescanso();
    if(sessionState.descansoRestante<=0){ clearInterval(sessionState.descansoInterval); }
  }, 1000);
  actualizarDescanso();
}

async function finalizarEntrenamiento(){
  if(sessionState.descansoInterval) clearInterval(sessionState.descansoInterval);
  const duracionMin = Math.max(1, Math.round((Date.now()-sessionState.inicio)/60000));
  const ejerciciosConSets = sessionState.ejercicios.filter(e=>e.sets.length>0);
  let volumenTotal = 0; const prsNuevos=[];
  ejerciciosConSets.forEach(e=>{
    const maxSetHoy = e.sets.reduce((m,s)=> (s.kg*s.reps > m.kg*m.reps? s : m), {kg:0,reps:0});
    volumenTotal += e.sets.reduce((s,set)=>s+set.kg*set.reps,0);
    const previo = sessionState.historialPrevio[e.exId];
    if(!previo || maxSetHoy.kg > previo.kg){ prsNuevos.push(`${e.nombre}: ${maxSetHoy.kg}kg × ${maxSetHoy.reps}`); }
  });
  const sesion = {fecha: today, rutinaNombre: sessionState.rutinaNombre, diaNombre: sessionState.diaNombre, duracionMin, volumenTotal, ejercicios: ejerciciosConSets};
  await setKey('sesion:'+Date.now(), sesion);
  sessionState = null; entrenarSubtab='historial';
  await render();
  if(prsNuevos.length) alert('🏆 Nuevo PR!\n'+prsNuevos.join('\n')); else alert('Entrenamiento guardado 💪');
}

async function renderHistorial(){
  const sesiones = await cargarSesiones();
  const prMap = {};
  sesiones.forEach(s=> (s.ejercicios||[]).forEach(e=>{
    const maxSet = e.sets.reduce((m,st)=> (st.kg*st.reps > m.kg*m.reps ? st : m), {kg:0,reps:0});
    if(!prMap[e.exId] || (maxSet.kg*maxSet.reps) > (prMap[e.exId].kg*prMap[e.exId].reps)) prMap[e.exId] = {...maxSet, nombre:e.nombre};
  }));
  const prs = Object.values(prMap).sort((a,b)=> (b.kg*b.reps)-(a.kg*a.reps)).slice(0,10);
  const hoy = new Date();
  const inicioSemana = new Date(hoy); inicioSemana.setDate(hoy.getDate()-6);
  const inicioSemanaPrev = new Date(hoy); inicioSemanaPrev.setDate(hoy.getDate()-13);
  const finSemanaPrev = new Date(hoy); finSemanaPrev.setDate(hoy.getDate()-7);
  const volSemana = sesiones.filter(s=> new Date(s.fecha) >= inicioSemana).reduce((a,s)=>a+(s.volumenTotal||0),0);
  const volSemanaPrev = sesiones.filter(s=>{ const f=new Date(s.fecha); return f>=inicioSemanaPrev && f<=finSemanaPrev; }).reduce((a,s)=>a+(s.volumenTotal||0),0);
  return `
    <div class="card accent"><h3>Volumen semanal (kg totales)</h3>
      <div class="grid2"><div><div class="bar-label"><span>Esta semana</span></div><div class="bignum" style="font-size:20px;">${Math.round(volSemana).toLocaleString()}</div></div>
      <div><div class="bar-label"><span>Semana anterior</span></div><div class="bignum" style="font-size:20px;">${Math.round(volSemanaPrev).toLocaleString()}</div></div></div>
    </div>
    <div class="card"><h3>🏆 Récords personales</h3>${prs.length===0?'<div class="empty">Todavía no hay PRs registrados</div>':prs.map(p=>`<div class="meal-item"><span>${p.nombre}</span><b>${p.kg}kg × ${p.reps}</b></div>`).join('')}</div>
    <div class="card"><h3>Entrenamientos</h3>
      ${sesiones.length===0?'<div class="empty">Todavía no completaste ningún entrenamiento</div>':
        sesiones.map((s,i)=>`
          <div class="day-block">
            <div class="day-header" data-toggle-sesion="${i}" style="cursor:pointer;"><b>${fmtDate(s.fecha)} · ${s.diaNombre}</b><span class="ex-meta">${s.duracionMin} min</span></div>
            ${sesionAbiertaIdx===i ? (s.ejercicios||[]).map(e=>`<div class="exrow-mini"><span>${e.nombre}</span><span class="ex-meta">${e.sets.map(st=>`${st.kg}×${st.reps}`).join(', ')}</span></div>`).join('') : ''}
          </div>
        `).join('')}
    </div>
  `;
}

async function buscarAlimento(q){
  const el = document.getElementById('resultados');
  el.innerHTML = '<div class="empty">Buscando...</div>';
  try{
    const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=15`;
    const res = await fetch(url);
    const data = await res.json();
    ultimaBusquedaComida = (data.products||[]).filter(p=>p.product_name && p.nutriments && p.nutriments['energy-kcal_100g']);
    if(ultimaBusquedaComida.length===0){ el.innerHTML = '<div class="empty">Sin resultados, probá cargarlo manual</div>'; return; }
    el.innerHTML = ultimaBusquedaComida.map((p,i)=>`<div class="food-result" data-food-idx="${i}"><div class="fname">${p.product_name}${p.brands ? ' · '+p.brands.split(',')[0] : ''}</div><div class="fmacros">${Math.round(p.nutriments['energy-kcal_100g']||0)} kcal /100g · P${Math.round(p.nutriments['proteins_100g']||0)} C${Math.round(p.nutriments['carbohydrates_100g']||0)} G${Math.round(p.nutriments['fat_100g']||0)}</div></div>`).join('');
    document.querySelectorAll('[data-food-idx]').forEach(elm=>{ elm.addEventListener('click', ()=> abrirCantidad(ultimaBusquedaComida[+elm.dataset.foodIdx])); });
  }catch(e){ el.innerHTML = '<div class="empty">No se pudo conectar. Probá cargarlo manual.</div>'; }
}

  try{
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json`);
    const data = await res.json();
    if(data.status===1 && data.product){ abrirCantidad(data.product); } else { alert('No se encontró ningún producto con ese código.'); }
  }catch(e){ alert('No se pudo conectar a la base de datos.'); }
}
function abrirCantidad(p){
  const modal = document.getElementById('cantidadModal');
  const n = p.nutriments || {};
  modal.innerHTML = `<div class="card accent"><h3>${p.product_name||'Producto'}</h3><label>Cantidad (gramos)</label><input type="number" id="cantGramos" value="100"><button class="btn-primary" id="confirmarCant">Agregar a hoy</button></div>`;
  document.getElementById('confirmarCant').addEventListener('click', async ()=>{
    const g = parseFloat(document.getElementById('cantGramos').value) || 100;
    const factor = g/100;
    const item = {nombre:`${p.product_name||'Producto'} (${g}g)`, kcal:(n['energy-kcal_100g']||0)*factor, prot:(n['proteins_100g']||0)*factor, carb:(n['carbohydrates_100g']||0)*factor, grasa:(n['fat_100g']||0)*factor};
    const dia = await loadDia(today); dia.comidas.push(item); await saveDia(today, dia); render();
  });
}

// ---------- PROGRESO ----------
async function renderProgreso(){
  const pesos = await loadAllPesos();
  const dia = await loadDia(today);
  const actual = pesos.length ? pesos[pesos.length-1].peso : perfil.peso_inicial;
  const diff = (actual - perfil.peso_inicial).toFixed(1);
  let chartSvg = '<div class="empty">Cargá tu peso para ver el gráfico</div>';
  if(pesos.length>=2){
    const w=440,h=140,pad=20; const vals = pesos.map(p=>p.peso); const min = Math.min(...vals)-0.5, max = Math.max(...vals)+0.5;
    const pts = pesos.map((p,i)=>{ const x=pad+i*((w-2*pad)/(pesos.length-1)); const y=h-pad-((p.peso-min)/(max-min))*(h-2*pad); return `${x},${y}`; }).join(' ');
    chartSvg = `<div class="chart-wrap"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="var(--primary)" stroke-width="2.5"/>${pesos.map((p,i)=>{const x=pad+i*((w-2*pad)/(pesos.length-1));const y=h-pad-((p.peso-min)/(max-min))*(h-2*pad);return `<circle cx="${x}" cy="${y}" r="3" fill="var(--primary)"/>`;}).join('')}</svg></div>`;
  }
  return `
    <div class="card accent"><h3>Peso de hoy</h3><div class="row"><input type="number" step="0.1" id="pesoHoyInput" placeholder="kg" value="${dia.peso||''}"><button class="btn-primary btn-icon" id="guardarPesoHoy">Guardar</button></div></div>
    <div class="card"><h3>Resumen</h3><div class="grid2"><div><div class="bar-label"><span>Inicial</span></div><div class="bignum" style="font-size:22px;">${perfil.peso_inicial} kg</div></div><div><div class="bar-label"><span>Actual</span></div><div class="bignum" style="font-size:22px;">${actual} kg</div></div></div><div class="divider"></div><div class="bar-label"><span>Cambio total</span><b style="color:${diff<0?'var(--primary)':'var(--danger)'}">${diff>0?'+':''}${diff} kg</b></div></div>
    <div class="card"><h3>Evolución</h3>${chartSvg}</div>
  `;
}

// ---------- PERFIL ----------
async function renderPerfil(){
  return `
    <div class="card"><h3>Tu perfil y objetivo</h3>
      <div class="grid2">
        <div><label>Altura (cm)</label><input type="number" id="perfAltura" value="${perfil.altura}"></div>
        <div><label>Edad</label><input type="number" id="perfEdad" value="${perfil.edad}"></div>
        <div><label>Kcal objetivo</label><input type="number" id="perfKcal" value="${perfil.kcal}"></div>
        <div><label>Proteína (g)</label><input type="number" id="perfProt" value="${perfil.prot}"></div>
        <div><label>Carbos (g)</label><input type="number" id="perfCarb" value="${perfil.carb}"></div>
        <div><label>Grasa (g)</label><input type="number" id="perfGrasa" value="${perfil.grasa}"></div>
      </div>
      <button class="btn-primary" id="guardarPerfil">Actualizar perfil</button>
    </div>
    <div class="card"><h3>Apariencia</h3><button class="btn-ghost" style="width:100%;" id="toggleTema">Cambiar a modo ${tema==='dark'?'claro':'oscuro'}</button></div>
    <div class="card"><h3>Favoritos</h3>
      ${favoritos.length===0 ? '<div class="empty">Todavía no marcaste favoritos</div>' :
        favoritos.map(id=>{const e=EJERCICIOS.find(x=>x.id===id); return e?`<div class="ex-card" data-abrir-ejercicio-perfil="${e.id}"><div class="ex-info"><div class="ex-name">${e.nombre}</div><div class="ex-meta">${e.grupo}</div></div></div>`:'';}).join('')}
    </div>
  `;
}

// ---------- HANDLERS ----------
function attachHandlers(){
  document.querySelectorAll('.navbtn').forEach(b=>{ b.onclick = ()=>{ currentTab=b.dataset.tab; ejercicioAbierto=null; render(); }; });

  const irRutinas = document.getElementById('irRutinas');
  if(irRutinas) irRutinas.onclick = ()=>{ currentTab='entrenar'; entrenarSubtab='rutina'; render(); };

  document.querySelectorAll('[data-entrenar-sub]').forEach(b=>{ b.onclick = ()=>{ entrenarSubtab=b.dataset.entrenarSub; render(); }; });

  const buscarEjercicio = document.getElementById('buscarEjercicio');
  if(buscarEjercicio){ buscarEjercicio.oninput = (e)=>{ busquedaEjercicio = e.target.value; }; buscarEjercicio.addEventListener('keydown', e=>{ if(e.key==='Enter'){ render(); } }); buscarEjercicio.addEventListener('blur', ()=> render()); }
  document.querySelectorAll('[data-grupo]').forEach(c=>{ c.onclick = ()=>{ filtroGrupo = c.dataset.grupo; render(); }; });

  document.querySelectorAll('[data-abrir-ejercicio]').forEach(c=>{ c.onclick = ()=>{ ejercicioAbierto = c.dataset.abrirEjercicio; render().then(()=>cargarGifDetalle(ejercicioAbierto)); }; });
  document.querySelectorAll('[data-abrir-ejercicio-perfil]').forEach(c=>{ c.onclick = ()=>{ currentTab='entrenar'; entrenarSubtab='biblioteca'; ejercicioAbierto = c.dataset.abrirEjercicioPerfil; render().then(()=>cargarGifDetalle(ejercicioAbierto)); }; });
  const volverBiblioteca = document.getElementById('volverBiblioteca');
  if(volverBiblioteca) volverBiblioteca.onclick = ()=>{ ejercicioAbierto=null; render(); };
  document.querySelectorAll('[data-fav]').forEach(b=>{ b.onclick = async (ev)=>{ ev.stopPropagation(); await toggleFavorito(b.dataset.fav); render().then(()=>{ if(ejercicioAbierto) cargarGifDetalle(ejercicioAbierto); }); }; });

  // Rutinas
  const nuevaRutina = document.getElementById('nuevaRutina');
  if(nuevaRutina) nuevaRutina.onclick = ()=>{ construyendoRutina = {id:'rut_'+Date.now(), nombre:'', dias:[]}; render(); };
  const toggleGenerador = document.getElementById('toggleGenerador');
  if(toggleGenerador) toggleGenerador.onclick = ()=>{ mostrandoGenerador = !mostrandoGenerador; render(); };
  const confirmarGenerar = document.getElementById('confirmarGenerar');
  if(confirmarGenerar) confirmarGenerar.onclick = async ()=>{
    const opts = { dias: parseInt(document.getElementById('genDias').value), objetivo: document.getElementById('genObjetivo').value, nivel: document.getElementById('genNivel').value, duracion: parseInt(document.getElementById('genDuracion').value), prioridad: document.getElementById('genPrioridad').value };
    const nueva = generarRutina(opts);
    const rutinas = (await getKey('rutinas')) || []; rutinas.push(nueva); await setKey('rutinas', rutinas);
    mostrandoGenerador = false; render();
  };
  document.querySelectorAll('[data-usar-plantilla]').forEach(b=>{ b.onclick = async ()=>{
    const p = PLANTILLAS.find(x=>x.id===b.dataset.usarPlantilla); const clone = JSON.parse(JSON.stringify(p)); clone.id = 'rut_'+Date.now();
    const rutinas = (await getKey('rutinas')) || []; rutinas.push(clone); await setKey('rutinas', rutinas); render();
  }; });
  document.querySelectorAll('[data-eliminar-rutina]').forEach(b=>{ b.onclick = async ()=>{
    const rutinas = (await getKey('rutinas')) || []; await setKey('rutinas', rutinas.filter(r=>r.id!==b.dataset.eliminarRutina)); render();
  }; });
  document.querySelectorAll('[data-empezar]').forEach(b=>{ b.onclick = async ()=>{
    const [rid, diIdx] = b.dataset.empezar.split(':'); const rutinas = (await getKey('rutinas')) || []; const rutina = rutinas.find(r=>r.id===rid);
    if(rutina) await iniciarEntrenamiento(rutina, parseInt(diIdx));
  }; });

  // Builder
  const cancelarBuilder = document.getElementById('cancelarBuilder');
  if(cancelarBuilder) cancelarBuilder.onclick = ()=>{ construyendoRutina = null; render(); };
  const nombreRutinaInput = document.getElementById('nombreRutinaInput');
  if(nombreRutinaInput) nombreRutinaInput.oninput = (e)=>{ construyendoRutina.nombre = e.target.value; };
  document.querySelectorAll('[data-dia-nombre]').forEach(inp=>{ inp.oninput = (e)=>{ construyendoRutina.dias[+inp.dataset.diaNombre].nombre = e.target.value; }; });
  document.querySelectorAll('[data-eliminar-dia]').forEach(b=>{ b.onclick = ()=>{ construyendoRutina.dias.splice(+b.dataset.eliminarDia,1); render(); }; });
  document.querySelectorAll('[data-target-dia]').forEach(inp=>{ inp.oninput = (e)=>{ construyendoRutina.dias[+inp.dataset.targetDia].ejercicios[+inp.dataset.targetEx].target = e.target.value; }; });
  document.querySelectorAll('[data-mover]').forEach(b=>{ b.onclick = ()=>{
    const [di,ei,dir] = b.dataset.mover.split(':').map(Number); const arr = construyendoRutina.dias[di].ejercicios; const nuevo = ei+dir;
    if(nuevo<0 || nuevo>=arr.length) return; [arr[ei],arr[nuevo]] = [arr[nuevo],arr[ei]]; render();
  }; });
  document.querySelectorAll('[data-quitar-ex]').forEach(b=>{ b.onclick = ()=>{ const [di,ei] = b.dataset.quitarEx.split(':').map(Number); construyendoRutina.dias[di].ejercicios.splice(ei,1); render(); }; });
  document.querySelectorAll('[data-agregar-ex-dia]').forEach(b=>{ b.onclick = ()=>{ pickerParaDia = +b.dataset.agregarExDia; render(); }; });
  const agregarDia = document.getElementById('agregarDia');
  if(agregarDia) agregarDia.onclick = ()=>{ construyendoRutina.dias.push({nombre:'Día '+(construyendoRutina.dias.length+1), ejercicios:[]}); render(); };
  const guardarRutina = document.getElementById('guardarRutina');
  if(guardarRutina) guardarRutina.onclick = async ()=>{
    if(!construyendoRutina.nombre) construyendoRutina.nombre = 'Mi rutina';
    const rutinas = (await getKey('rutinas')) || []; rutinas.push(construyendoRutina); await setKey('rutinas', rutinas);
    construyendoRutina = null; render();
  };
  const cerrarPicker = document.getElementById('cerrarPicker');
  if(cerrarPicker) cerrarPicker.onclick = ()=>{ pickerParaDia = null; render(); };
  document.querySelectorAll('[data-pick-ejercicio]').forEach(c=>{ c.onclick = ()=>{
    construyendoRutina.dias[pickerParaDia].ejercicios.push({exId:c.dataset.pickEjercicio, target:'3x10'}); pickerParaDia = null; render();
  }; });

  // Modo entrenamiento
  const completarSerie = document.getElementById('completarSerie');
  if(completarSerie) completarSerie.onclick = ()=>{
    const kg = parseFloat(document.getElementById('setKg').value) || 0;
    const reps = parseInt(document.getElementById('setReps').value) || 0;
    const rirVal = document.getElementById('setRir').value;
    const rir = rirVal===''? null : parseInt(rirVal);
    if(reps<=0) return;
    sessionState.ejercicios[sessionState.idx].sets.push({kg,reps,rir});
    iniciarDescanso(sessionState.descansoSeg || 90);
    render();
  };
  document.querySelectorAll('[data-descanso]').forEach(b=>{ b.onclick = ()=>{ iniciarDescanso(parseInt(b.dataset.descanso)); }; });
  const exAnterior = document.getElementById('exAnterior');
  if(exAnterior) exAnterior.onclick = ()=>{ if(sessionState.idx>0){ sessionState.idx--; render(); } };
  const exSiguiente = document.getElementById('exSiguiente');
  if(exSiguiente) exSiguiente.onclick = ()=>{ if(sessionState.idx < sessionState.ejercicios.length-1){ sessionState.idx++; render(); } };
  const finalizarEntreno = document.getElementById('finalizarEntreno');
  if(finalizarEntreno) finalizarEntreno.onclick = ()=> finalizarEntrenamiento();

  // Historial
  document.querySelectorAll('[data-toggle-sesion]').forEach(el=>{ el.onclick = ()=>{ const i = +el.dataset.toggleSesion; sesionAbiertaIdx = sesionAbiertaIdx===i? null : i; render(); }; });

  // Nutrición
  const guardarPesoHoy = document.getElementById('guardarPesoHoy');
  if(guardarPesoHoy) guardarPesoHoy.onclick = async ()=>{ const v = parseFloat(document.getElementById('pesoHoyInput').value); if(!v) return; const dia = await loadDia(today); dia.peso = v; await saveDia(today, dia); render(); };
  document.querySelectorAll('[data-del-comida]').forEach(b=>{ b.onclick = async ()=>{ const dia = await loadDia(today); dia.comidas.splice(+b.dataset.delComida,1); await saveDia(today, dia); render(); }; });
  const buscarBtn = document.getElementById('buscarBtn');
  if(buscarBtn) buscarBtn.onclick = ()=>{ const q = document.getElementById('buscarInput').value.trim(); if(q) buscarAlimento(q); };
  const buscarInput = document.getElementById('buscarInput');
  if(buscarInput) buscarInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); buscarBtn.click(); } });
  const barcodeBtn = document.getElementById('barcodeBtn');
  if(barcodeBtn) barcodeBtn.onclick = ()=>{ const c = document.getElementById('barcodeInput').value.trim(); if(c) buscarPorCodigoBarras(c); };
  const manAgregar = document.getElementById('manAgregar');
  if(manAgregar) manAgregar.onclick = async ()=>{
    const nombre = document.getElementById('manNombre').value.trim();
    const kcal = parseFloat(document.getElementById('manKcal').value)||0;
    const prot = parseFloat(document.getElementById('manProt').value)||0;
    const carb = parseFloat(document.getElementById('manCarb').value)||0;
    const grasa = parseFloat(document.getElementById('manGrasa').value)||0;
    if(!nombre || !kcal) return;
    const dia = await loadDia(today); dia.comidas.push({nombre,kcal,prot,carb,grasa}); await saveDia(today, dia); render();
  };

  // Perfil
  const guardarPerfil = document.getElementById('guardarPerfil');
  if(guardarPerfil) guardarPerfil.onclick = async ()=>{
    perfil.altura = parseFloat(document.getElementById('perfAltura').value)||perfil.altura;
    perfil.edad = parseFloat(document.getElementById('perfEdad').value)||perfil.edad;
    perfil.kcal = parseFloat(document.getElementById('perfKcal').value)||perfil.kcal;
    perfil.prot = parseFloat(document.getElementById('perfProt').value)||perfil.prot;
    perfil.carb = parseFloat(document.getElementById('perfCarb').value)||perfil.carb;
    perfil.grasa = parseFloat(document.getElementById('perfGrasa').value)||perfil.grasa;
    await setKey('perfil', perfil); render();
  };
  const toggleTema = document.getElementById('toggleTema');
  if(toggleTema) toggleTema.onclick = async ()=>{ tema = tema==='dark' ? 'light' : 'dark'; document.body.dataset.theme = tema; await setKey('tema', tema); render(); };
}

async function cargarGifDetalle(id){
  const e = EJERCICIOS.find(x=>x.id===id); if(!e) return;
  const box = document.getElementById('gifBox'); if(!box) return;
  const url = await getExerciseGif(e.nombre);
  if(url){ box.innerHTML = `<img src="${url}" alt="${e.nombre}">`; }
  else { box.innerHTML = `<div class="placeholder">GIF no disponible todavía para este ejercicio.<br>Buscalo en YouTube: "${e.nombre}"</div>`; }
}

// ---------- INIT ----------
(async function init(){
  await loadPerfil();
  await loadFavoritos();
  tema = (await getKey('tema')) || 'dark';
  document.body.dataset.theme = tema;
  await render();
})();
</script>
