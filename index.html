<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>FORJA — Entrenamiento & Nutrición</title>
<style>
  :root{
    --bg:#0B0C0E; --surface:#16181C; --surface2:#1E2126; --surface3:#272B31; --line:#2C3037;
    --text:#F5F6F4; --muted:#8B919A; --primary:#C6FF3D; --primary-soft:rgba(198,255,61,.12);
    --danger:#FF5C6E; --success:#3ED98A; --info:#5BC0FF; --radius:14px; --radius-sm:10px;
  }
  body[data-theme="light"]{
    --bg:#F2F3F0; --surface:#FFFFFF; --surface2:#EEF0EA; --surface3:#E3E6DE; --line:#D7DAD2;
    --text:#14161A; --muted:#5C6067; --primary:#3E7D1C; --primary-soft:rgba(62,125,28,.10);
  }
  body[data-theme="light"] .btn-primary, body[data-theme="light"] .chip.active, body[data-theme="light"] .subtabs button.active{ color:#fff; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:88px; min-height:100vh; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:480px; margin:0 auto; padding:12px 16px 8px;}
  h1,h2,h3{margin:0; font-weight:800; letter-spacing:-0.02em;}
  ::-webkit-scrollbar{display:none;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:calc(14px + env(safe-area-inset-top)) 16px 8px; max-width:480px; margin:0 auto; position:sticky; top:0; background:var(--bg); z-index:5;}
  .brand{font-size:19px; font-weight:800; letter-spacing:-0.03em;}
  .brand span{color:var(--primary);}
  .streak{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:4px;}
  .card{background:var(--surface); border-radius:var(--radius); padding:16px; margin-bottom:12px; border:1px solid var(--line); transition:border-color .15s;}
  .card.accent{border-color:var(--primary); box-shadow:0 0 0 1px var(--primary) inset;}
  .card.hero{background:linear-gradient(155deg, var(--surface3), var(--surface)); position:relative; overflow:hidden;}
  .card h3{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:12px; font-weight:700;}
  .card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .card-head h3{margin-bottom:0;}
  .hello{font-size:22px; font-weight:800; letter-spacing:-.02em; margin-bottom:2px;}
  .subhello{font-size:12.5px; color:var(--muted); margin-bottom:14px;}
  .bignum{font-size:30px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
  .bignum small{font-size:12.5px; color:var(--muted); font-weight:600;}
  .bar-row{margin-bottom:10px;}
  .bar-label{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px; color:var(--muted);}
  .bar-label b{color:var(--text); font-weight:700;}
  .bar-track{height:7px; background:var(--surface2); border-radius:20px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:20px; transition:width .4s cubic-bezier(.4,0,.2,1);}
  input, select, textarea{width:100%; background:var(--surface2); border:1px solid var(--line); color:var(--text); padding:12px; border-radius:var(--radius-sm); font-size:15px; margin-bottom:8px; font-family:inherit; min-height:44px;}
  textarea{min-height:60px; resize:vertical;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--primary);}
  input::placeholder{color:var(--muted);}
  label{font-size:12px; color:var(--muted); display:block; margin-bottom:4px; font-weight:600;}
  .row{display:flex; gap:8px;}
  .row > *{flex:1;}
  button{font-family:inherit; font-weight:700; font-size:14.5px; border:none; border-radius:var(--radius-sm); padding:12px 14px; cursor:pointer; min-height:44px; transition:transform .1s, opacity .15s, background .15s;}
  button:active{transform:scale(.97);}
  button:disabled{opacity:.3; pointer-events:none;}
  .btn-primary{background:var(--primary); color:#0B0C0E; width:100%;}
  .btn-ghost{background:var(--surface2); color:var(--text); border:1px solid var(--line);}
  .btn-sm{padding:8px 10px; font-size:12.5px; min-height:36px;}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid var(--danger);}
  .btn-icon{width:auto; flex:0 0 auto;}
  .chips{display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;}
  .chip{flex:0 0 auto; background:var(--surface2); color:var(--muted); border:1px solid var(--line); border-radius:20px; padding:8px 14px; font-size:12.5px; font-weight:600; white-space:nowrap; cursor:pointer; min-height:36px; display:flex; align-items:center;}
  .chip.active{background:var(--primary); color:#0B0C0E; border-color:var(--primary);}
  .ex-card{display:flex; gap:12px; align-items:center; padding:11px; background:var(--surface2); border-radius:var(--radius-sm); margin-bottom:8px; cursor:pointer; border:1px solid transparent;}
  .ex-card:active{border-color:var(--primary); background:var(--primary-soft);}
  .ex-avatar{width:44px; height:44px; border-radius:10px; background:var(--surface3); display:flex; align-items:center; justify-content:center; font-size:19px; flex:0 0 auto;}
  .ex-info{flex:1; min-width:0;}
  .ex-name{font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ex-meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .ex-fav{color:var(--muted); font-size:19px; flex:0 0 auto; background:none; padding:4px; min-height:auto;}
  .ex-fav.active{color:var(--primary);}
  .tag{display:inline-block; font-size:11px; padding:4px 10px; border-radius:20px; background:var(--surface3); color:var(--muted); margin:0 5px 5px 0; font-weight:600;}
  .tag.primary{background:var(--primary); color:#0B0C0E;}
  .gif-box{width:100%; aspect-ratio:1/1; max-height:280px; background:var(--surface2); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; margin-bottom:12px; overflow:hidden;}
  .gif-box img{width:100%; height:100%; object-fit:contain;}
  .gif-box .placeholder{color:var(--muted); font-size:12.5px; text-align:center; padding:20px;}
  .subtabs{display:flex; gap:6px; margin-bottom:14px; background:var(--surface2); padding:4px; border-radius:12px;}
  .subtabs button{flex:1; background:none; color:var(--muted); border:none; min-height:38px; border-radius:9px;}
  .subtabs button.active{background:var(--primary); color:#0B0C0E;}
  .meal-item{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .meal-item:last-child{border-bottom:none;}
  .meal-item .macros{font-size:11.5px; color:var(--muted);}
  .meal-section{margin-bottom:14px;}
  .meal-section-head{display:flex; justify-content:space-between; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid var(--line);}
  .food-result{padding:10px; border-bottom:1px solid var(--line); cursor:pointer;}
  .food-result:active{background:var(--surface2);}
  .food-result .fname{font-size:14px; font-weight:600;}
  .food-result .fmacros{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .empty{color:var(--muted); font-size:13.5px; text-align:center; padding:26px 14px;}
  .empty .big{font-size:30px; margin-bottom:8px;}
  .empty button{margin-top:12px; width:auto; padding:10px 18px;}
  .chart-wrap{width:100%; overflow-x:auto;}
  .divider{height:1px; background:var(--line); margin:14px 0;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .backbtn{background:none; color:var(--muted); font-size:13px; padding:6px 0; margin-bottom:6px; min-height:auto;}
  .step{font-size:13.5px; line-height:1.5; margin-bottom:8px; padding-left:18px; position:relative;}
  .step::before{content:"•"; position:absolute; left:2px; color:var(--primary);}
  .bottomnav{position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--line); display:flex; z-index:10; padding-bottom:env(safe-area-inset-bottom);}
  .bottomnav button{flex:1; background:none; border:none; border-radius:0; color:var(--muted); padding:10px 2px 8px; font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:3px; min-height:56px;}
  .bottomnav button:active{transform:none; opacity:.6;}
  .bottomnav button.active{color:var(--primary);}
  .bottomnav svg{width:19px; height:19px;}
  .badge-soon{font-size:9px; background:var(--surface3); color:var(--muted); padding:1px 6px; border-radius:10px; margin-left:5px;}
  .day-block{background:var(--surface2); border-radius:var(--radius-sm); padding:12px; margin-bottom:10px; border:1px solid var(--line);}
  .day-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:14px; gap:8px;}
  .day-header-actions{display:flex; gap:6px;}
  .exrow-mini{display:flex; justify-content:space-between; align-items:center; gap:6px; font-size:13px; padding:7px 0; border-bottom:1px solid var(--line);}
  .exrow-mini:last-child{border-bottom:none;}
  .exrow-mini input{width:60px; margin-bottom:0; padding:7px 8px; font-size:13px; min-height:36px;}
  .set-table-head{display:grid; grid-template-columns:26px 56px 1fr 1fr 44px 36px; gap:5px; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; padding:0 0 6px; font-weight:700;}
  .set-table-row{display:grid; grid-template-columns:26px 56px 1fr 1fr 44px 36px; gap:5px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .set-table-row:last-child{border-bottom:none;}
  .set-table-row input{margin-bottom:0; padding:7px 4px; font-size:13px; text-align:center; min-height:38px;}
  .set-num{font-weight:700; color:var(--muted); text-align:center;}
  .set-prev{color:var(--muted); font-size:11.5px; text-align:center; background:none; border:none; padding:0; min-height:auto;}
  .set-done{color:var(--text); text-align:center; font-weight:600;}
  .set-check{background:var(--surface3); color:var(--muted); border:none; border-radius:8px; padding:0; min-height:34px; font-size:15px;}
  .set-check.active{background:var(--primary); color:#0B0C0E;}
  .floating-timer{position:fixed; left:12px; right:12px; bottom:calc(80px + env(safe-area-inset-bottom)); background:var(--surface3); border:1.5px solid var(--primary); border-radius:16px; padding:12px 16px; display:none; justify-content:space-between; align-items:center; z-index:20; box-shadow:0 10px 30px rgba(0,0,0,.5); max-width:448px; margin:0 auto;}
  .ft-label{font-size:9.5px; color:var(--muted); letter-spacing:.06em; display:block; font-weight:700;}
  .ft-time{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums;}
  .ft-actions{display:flex; gap:6px;}
  .ft-actions button{padding:8px 11px; font-size:11.5px; min-height:36px;}
  .toast-container{position:fixed; top:calc(10px + env(safe-area-inset-top)); left:12px; right:12px; z-index:60; display:flex; flex-direction:column; gap:8px; pointer-events:none; max-width:456px; margin:0 auto;}
  .toast{background:var(--surface3); border:1.5px solid var(--primary); color:var(--text); padding:13px 15px; border-radius:12px; font-size:13.5px; font-weight:600; box-shadow:0 10px 26px rgba(0,0,0,.5); opacity:0; transform:translateY(-14px); transition:all .25s cubic-bezier(.4,0,.2,1);}
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.error{border-color:var(--danger);}
  .toast.success{border-color:var(--success);}
  .progress-ring{display:flex; align-items:center; gap:14px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">FOR<span>JA</span></div>
  <div class="streak" id="streakEl">día 1 · 60</div>
</div>

<div class="wrap" id="app"></div>

<div id="floatingTimer" class="floating-timer">
  <div><span class="ft-label">DESCANSO</span><span class="ft-time" id="ftTime">01:30</span></div>
  <div class="ft-actions">
    <button class="btn-ghost btn-sm" id="ftMinus">−30</button>
    <button class="btn-ghost btn-sm" id="ftPlus">+30</button>
    <button class="btn-primary btn-sm" id="ftSkip">Omitir</button>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<div class="bottomnav">
  <button data-tab="inicio" class="navbtn active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
    Inicio
  </button>
  <button data-tab="entrenar" class="navbtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 6.5l11 11M21 21l-1-1M3 3l1 1M18.5 3.5l-15 15M4 20l1.5-1.5M18.5 5.5L20 4"/></svg>
    Entrenar
  </button>
  <button data-tab="nutricion" class="navbtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/></svg>
    Nutrición
  </button>
  <button data-tab="progreso" class="navbtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M7 14l4-4 3 3 5-6"/></svg>
    Progreso
  </button>
  <button data-tab="perfil" class="navbtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>
    Perfil
  </button>
</div>

<script>
/* =====================================================================
   FORJA — v2: dashboard rediseñado, modo entrenamiento con tabla de
   series + timer flotante + reemplazo de ejercicio + notas, rutinas con
   editar/duplicar, nutrición por comida (desayuno/almuerzo/merienda/
   cena/snacks), progreso con filtro de tiempo y kg/lb, toasts en vez de
   alert(), validaciones, estados vacíos con CTA.
   Límite honesto: la biblioteca tiene 48 ejercicios reales y curados
   (no 200 inventados), el escaneo de código de barras es manual por
   EAN (cámara nativa no disponible en este entorno).
===================================================================== */

// ============ CONFIG ============
const DEFAULT_PERFIL = { nombre:'Juani', peso_inicial: 96, altura: 192, edad: 19, fecha_inicio: new Date().toISOString().slice(0,10), kcal: 2200, prot: 210, carb: 170, grasa: 75, unidad:'kg', diasEntrenamiento: 4 };
const CATEGORIAS_COMIDA = [ {id:'desayuno', label:'Desayuno'}, {id:'almuerzo', label:'Almuerzo'}, {id:'merienda', label:'Merienda'}, {id:'cena', label:'Cena'}, {id:'snacks', label:'Snacks'} ];

// ============ DATA: EJERCICIOS ============
const EJERCICIOS = [
  {id:'pec01', nombre:'Press banca con barra', grupo:'pecho', secundarios:['tríceps','hombro anterior'], equipo:'Barra', patron:'Empuje horizontal', dificultad:'Intermedio', pasos:['Acostate en el banco con los pies firmes en el piso.','Agarrá la barra un poco más ancho que los hombros y bajala controlada al pecho.','Empujá hasta extender los brazos sin trabar los codos de golpe.'], errores:['Rebotar la barra en el pecho.','Levantar la cadera del banco.'], consejos:['Retraé las escápulas antes de empezar.','Controlá más la bajada que la subida.'], variantes:['Press banca mancuernas','Press inclinado barra','Press en Smith']},
  {id:'pec02', nombre:'Press banca con mancuernas', grupo:'pecho', secundarios:['tríceps','hombro anterior'], equipo:'Mancuernas', patron:'Empuje horizontal', dificultad:'Intermedio', pasos:['Sentate con una mancuerna en cada muslo y recostate llevándolas al pecho.','Empujá ambas mancuernas hacia arriba sin chocarlas.','Bajá controlado hasta sentir estiramiento en el pecho.'], errores:['Abrir demasiado los codos.','Usar rango muy corto.'], consejos:['Mayor rango de movimiento que con barra.','Girá levemente las muñecas arriba para contraer mejor.'], variantes:['Press banca barra','Press inclinado mancuernas']},
  {id:'pec03', nombre:'Press inclinado con barra', grupo:'pecho', secundarios:['hombro anterior','tríceps'], equipo:'Barra', patron:'Empuje horizontal', dificultad:'Intermedio', pasos:['Ajustá el banco a 30-45°.','Bajá la barra a la parte alta del pecho.','Empujá hacia arriba y levemente atrás.'], errores:['Inclinar el banco demasiado.','Bajar la barra al cuello.'], consejos:['30° es suficiente para enfatizar pecho alto.'], variantes:['Press inclinado mancuernas','Press declinado']},
  {id:'pec04', nombre:'Press inclinado con mancuernas', grupo:'pecho', secundarios:['hombro anterior','tríceps'], equipo:'Mancuernas', patron:'Empuje horizontal', dificultad:'Intermedio', pasos:['Banco a 30°, mancuernas a la altura del pecho alto.','Empujá hacia arriba juntando las mancuernas arriba.','Bajá controlado.'], errores:['Perder el arco natural de la muñeca.'], consejos:['Buena opción para asimetrías entre lados.'], variantes:['Press inclinado barra']},
  {id:'pec05', nombre:'Press declinado con barra', grupo:'pecho', secundarios:['tríceps'], equipo:'Barra', patron:'Empuje horizontal', dificultad:'Intermedio', pasos:['Asegurá las piernas en el banco declinado.','Bajá la barra a la parte baja del pecho.','Empujá hacia arriba.'], errores:['Rango de movimiento incompleto.'], consejos:['Enfatiza la porción inferior del pectoral.'], variantes:['Press banca plano','Fondos en paralelas']},
  {id:'pec06', nombre:'Press en máquina (Chest Press)', grupo:'pecho', secundarios:['tríceps'], equipo:'Máquina', patron:'Empuje horizontal', dificultad:'Principiante', pasos:['Ajustá el asiento a la altura del pecho.','Empujá las manijas hacia adelante sin trabar codos.','Volvé controlado.'], errores:['Asiento mal ajustado castiga el hombro.'], consejos:['Ideal para aprender el patrón sin estabilizar peso libre.'], variantes:['Press convergente','Press banca']},
  {id:'pec07', nombre:'Press convergente (Hammer Strength)', grupo:'pecho', secundarios:['tríceps'], equipo:'Máquina', patron:'Empuje horizontal', dificultad:'Principiante', pasos:['Sentate y agarrá las manijas convergentes.','Empujá al frente juntando el recorrido.','Volvé controlado sin soltar tensión.'], errores:['Usar demasiado peso y perder rango.'], consejos:['Buena para volumen al final del entreno.'], variantes:['Press en máquina','Press banca']},
  {id:'pec08', nombre:'Aperturas con mancuernas', grupo:'pecho', secundarios:[], equipo:'Mancuernas', patron:'Aducción horizontal', dificultad:'Intermedio', pasos:['Acostate con mancuernas arriba del pecho, codos con leve flexión fija.','Abrí los brazos en arco hasta sentir estiramiento.','Cerrá volviendo a la posición inicial.'], errores:['Flexionar y extender el codo.','Usar demasiado peso.'], consejos:['Es un ejercicio de aislamiento, priorizá técnica sobre carga.'], variantes:['Aperturas en máquina','Cruce de poleas']},
  {id:'pec09', nombre:'Aperturas en máquina (Pec Deck)', grupo:'pecho', secundarios:[], equipo:'Máquina', patron:'Aducción horizontal', dificultad:'Principiante', pasos:['Ajustá el asiento para que las manijas queden a la altura del pecho.','Juntá los brazos al frente contrayendo el pecho.','Volvé controlado.'], errores:['Rebotar en la posición final.'], consejos:['Buena para el final del entreno.'], variantes:['Aperturas mancuernas','Cruce de poleas']},
  {id:'pec10', nombre:'Cruce de poleas (Cable Crossover)', grupo:'pecho', secundarios:[], equipo:'Poleas', patron:'Aducción horizontal', dificultad:'Intermedio', pasos:['Poleas altas, un paso adelante en posición de tijera.','Llevá las manos al frente y abajo cruzando levemente.','Volvé controlado sin perder tensión en el cable.'], errores:['Usar solo los brazos sin involucrar el pecho.'], consejos:['Cambiá la altura de la polea para enfatizar distintas fibras.'], variantes:['Aperturas mancuernas','Aperturas en máquina']},
  {id:'pec11', nombre:'Fondos en paralelas (pecho)', grupo:'pecho', secundarios:['tríceps'], equipo:'Peso corporal', patron:'Empuje horizontal', dificultad:'Avanzado', pasos:['Sostenete en las paralelas con el torso inclinado adelante.','Bajá flexionando los codos hasta sentir estiramiento en el pecho.','Empujá hacia arriba.'], errores:['Bajar demasiado y sobrecargar el hombro.'], consejos:['Inclinar el torso adelante enfatiza más pecho que tríceps.'], variantes:['Press declinado','Flexiones']},
  {id:'pec12', nombre:'Flexiones de brazos', grupo:'pecho', secundarios:['tríceps','core'], equipo:'Peso corporal', patron:'Empuje horizontal', dificultad:'Principiante', pasos:['Manos un poco más anchas que los hombros, cuerpo en línea recta.','Bajá el pecho cerca del piso.','Empujá hasta extender los brazos.'], errores:['Cadera caída o elevada.'], consejos:['Elevá los pies para aumentar dificultad.'], variantes:['Press banca','Fondos']},

// ============ STORAGE ============
// window.storage solo existe dentro de Claude.ai. Fuera de ahí (ej. este
// sitio desplegado en Vercel) no existe, así que usamos localStorage con
// la misma forma de API para que la app funcione igual en los dos lugares.
const STORAGE_PREFIX = 'forja:';
const storageBackend = (typeof window.storage === 'object' && window.storage && typeof window.storage.get === 'function')
  ? window.storage
  : {
      async get(key){ const v = localStorage.getItem(STORAGE_PREFIX+key); return v!==null ? {key, value:v} : null; },
      async set(key, value){ localStorage.setItem(STORAGE_PREFIX+key, value); return {key, value}; },
      async delete(key){ localStorage.removeItem(STORAGE_PREFIX+key); return {key, deleted:true}; },
      async list(prefix){
        const keys = [];
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(k && k.startsWith(STORAGE_PREFIX)){
            const bare = k.slice(STORAGE_PREFIX.length);
            if(!prefix || bare.startsWith(prefix)) keys.push(bare);
          }
        }
        return {keys};
      }
    };
async function getKey(key){ try{ const r = await storageBackend.get(key); return r ? JSON.parse(r.value) : null; } catch(e){ return null; } }
async function setKey(key, value){ try{ await storageBackend.set(key, JSON.stringify(value)); } catch(e){ console.error('storage set fail', key, e); } }
async function loadPerfil(){ const p = await getKey('perfil'); perfil = p ? {...DEFAULT_PERFIL, ...p} : {...DEFAULT_PERFIL}; if(!p) await setKey('perfil', perfil); }
async function loadFavoritos(){ favoritos = (await getKey('favoritos_ejercicios')) || []; }
async function toggleFavorito(id){ if(favoritos.includes(id)) favoritos = favoritos.filter(f=>f!==id); else favoritos.push(id); await setKey('favoritos_ejercicios', favoritos); }
async function loadDia(date){ return (await getKey('dia:'+date)) || {comidas:[], peso:null}; }
async function saveDia(date, data){ await setKey('dia:'+date, data); }
async function loadAllPesos(){
  try{ const list = await storageBackend.list('dia:'); if(!list || !list.keys) return [];
    const out = []; for(const k of list.keys){ const d = await getKey(k); if(d && d.peso){ out.push({fecha:k.replace('dia:',''), peso:d.peso}); } }
    return out.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  }catch(e){ return []; }
}
async function cargarSesiones(){
  try{ const list = await storageBackend.list('sesion:'); if(!list || !list.keys) return [];
    const out = []; for(const k of list.keys){ const s = await getKey(k); if(s) out.push(s); }
    return out.sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
  }catch(e){ return []; }
}

// ============ UTILS ============
function fmtDate(d){ const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('es-AR',{day:'2-digit',month:'short'}); }
function formatMMSS(s){ if(s<0)s=0; const m=Math.floor(s/60); const sec=s%60; return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); }
function kgToLb(kg){ return Math.round(kg*2.20462*10)/10; }
function fmtPeso(kg){ if(kg==null) return '—'; return perfil.unidad==='lb' ? `${kgToLb(kg)} lb` : `${kg} kg`; }
function parseSetsCount(target){ const m = String(target).match(/^(\d+)\s*x/i); return m ? parseInt(m[1]) : 3; }
function getExById(id){ return EJERCICIOS.find(e=>e.id===id); }
function obtenerSimilares(exId){
  const base = getExById(exId);
  if(!base) return [];
  return EJERCICIOS.filter(o=> o.id!==exId && o.grupo===base.grupo && (o.patron===base.patron || (base.variantes||[]).some(v=>v.toLowerCase()===o.nombre.toLowerCase())));
}
function aplicarSeleccionEjercicio(id){
  const info = getExById(id);

  if(swapContext && swapContext.modo==='workout'){

}
function listaFiltrada(){
  return EJERCICIOS.filter(e=>{

    const okBusqueda = !busquedaEjercicio || e.nombre.toLowerCase().includes(busquedaEjercicio.toLowerCase());
    return okGrupo && okBusqueda;
  });
}
function showToast(msg, tipo){
  const cont = document.getElementById('toastContainer'); if(!cont) return;
  const el = document.createElement('div');
  el.className = 'toast' + (tipo==='error'?' error':tipo==='success'?' success':'');
  el.textContent = msg;
  cont.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));

}
function updateFloatingTimer(){
  const bar = document.getElementById('floatingTimer'); if(!bar) return;
  const activo = sessionState && sessionState.descansoRestante > 0;
  bar.style.display = activo ? 'flex' : 'none';
  if(activo) document.getElementById('ftTime').textContent = formatMMSS(sessionState.descansoRestante);
  const inline = document.getElementById('descansoDisplay');

}
function iniciarDescanso(seg){
  sessionState.descansoSeg = seg; sessionState.descansoRestante = seg;
  if(sessionState.descansoInterval) clearInterval(sessionState.descansoInterval);
  sessionState.descansoInterval = setInterval(()=>{
    if(!sessionState) return;
    sessionState.descansoRestante--;

    if(sessionState.descansoRestante<=0) clearInterval(sessionState.descansoInterval);
  }, 1000);

}

// ============ GIF (ExerciseDB OSS, gratis, sin key) ============
// El endpoint real usa el parámetro "search" (no "q"). Probamos varias
// variantes de URL y de nombre por si una falla, antes de rendirnos.
const gifCache = {};
function extraerItemGif(data){
  const candidatos = (data && (data.data || data.exercises || data.results || (Array.isArray(data)?data:null))) || [];
  const item = Array.isArray(candidatos) ? candidatos[0] : null;
  if(!item) return null;
  return item.gifUrl || item.gif_url || null;
}
async function intentarFetchGif(url){
  try{
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    return extraerItemGif(data);
  }catch(e){ return null; }
}
async function getExerciseGif(nombreEs){
  if(gifCache[nombreEs] !== undefined) return gifCache[nombreEs];
  const nombreEn = TRADUCCION_GIF[nombreEs] || nombreEs;
  const nombreCorto = nombreEn.split(' ').slice(0,2).join(' ');
  const intentos = [
    `https://oss.exercisedb.dev/api/v1/exercises/search?search=${encodeURIComponent(nombreEn)}&limit=3`,
    `https://oss.exercisedb.dev/api/v1/exercises?search=${encodeURIComponent(nombreEn)}&limit=3`,
    `https://oss.exercisedb.dev/api/v1/exercises/search?search=${encodeURIComponent(nombreCorto)}&limit=3`,
    `https://oss.exercisedb.dev/api/v1/exercises/name/${encodeURIComponent(nombreEn)}`,
  ];
  for(const url of intentos){
    const gif = await intentarFetchGif(url);
    if(gif){ gifCache[nombreEs] = gif; return gif; }
  }
  gifCache[nombreEs] = null;
  return null;
}

async function calcularRacha(){
  const sesiones = await cargarSesiones();
  const fechas = new Set(sesiones.map(s=>s.fecha));
  let racha=0; let cursor=new Date(today);
  while(true){ const key = cursor.toISOString().slice(0,10); if(fechas.has(key)){ racha++; cursor.setDate(cursor.getDate()-1); } else break; }
  const semana=[]; const nombresDias=['D','L','M','X','J','V','S'];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const key=d.toISOString().slice(0,10); semana.push({dia:nombresDias[d.getDay()], hecho: fechas.has(key)}); }
  return {racha, semana, totalEntrenamientos: sesiones.length};
}

function generarRutina({dias, objetivo, nivel, duracion, prioridad}){
  const repsPorObjetivo = {fuerza:'4x5', masa:'4x10', recomp:'3x12'};
  const exPorDia = {30:3,45:4,60:5,75:6,90:7}[duracion] || 5;
  const nombreGrupo = {pecho:'Pecho', espalda:'Espalda', biceps:'Bíceps', triceps:'Tríceps', antebrazos:'Antebrazos', trapecios:'Trapecios'};
  const offsetPorGrupo = {}; // para no repetir siempre los mismos ejercicios entre día 1 y día 2 del mismo tipo
  function tomarDeGrupo(grupo, cantidad){
    const pool = EJERCICIOS.filter(e=>e.grupo===grupo);
    if(pool.length===0 || cantidad<=0) return [];
    const offset = offsetPorGrupo[grupo] || 0;
    const seleccion = [];
    for(let i=0;i<cantidad;i++) seleccion.push(pool[(offset+i) % pool.length]);
    offsetPorGrupo[grupo] = offset + cantidad;
    return seleccion;
  }
  const diasArr = [];
  for(let i=0;i<dias;i++){
    const esEmpuje = i%2===0;
    const gruposDia = esEmpuje ? ['pecho','triceps'] : ['espalda','biceps'];
    // repartimos los ejercicios del día entre los dos grupos musculares (60/40), nunca todo a uno solo
    let cantMayor = Math.max(1, Math.ceil(exPorDia*0.6));
    let cantMenor = Math.max(1, exPorDia - cantMayor);
    if(cantMayor + cantMenor > exPorDia) cantMayor = exPorDia - cantMenor;
    let seleccionados = [ ...tomarDeGrupo(gruposDia[0], cantMayor), ...tomarDeGrupo(gruposDia[1], cantMenor) ];
    if(prioridad && prioridad!=='ninguna' && !gruposDia.includes(prioridad)){
      seleccionados = [...tomarDeGrupo(prioridad,1), ...seleccionados];
    }
    const numero = Math.floor(i/2)+1;
    const etiquetaGrupos = gruposDia.map(g=>nombreGrupo[g]).join(' + ');
    diasArr.push({ nombre: `${esEmpuje?'Empuje':'Tirón'} ${numero} (${etiquetaGrupos})`, ejercicios: seleccionados.map(e=>({exId:e.id, target: repsPorObjetivo[objetivo] || '3x10'})) });
  }
  return {id:'gen_'+Date.now(), nombre:`Rutina generada · ${dias}d · ${objetivo}`, dias:diasArr};
}

async function calcularHistorialPrevio(exIds){
  const sesiones = await cargarSesiones();
  const map = {};
  sesiones.forEach(s=> (s.ejercicios||[]).forEach(e=>{
    if(!exIds.includes(e.exId)) return;
    const maxSet = e.sets.reduce((m,st)=> (st.kg*st.reps > m.kg*m.reps ? st : m), {kg:0,reps:0});
    if(!map[e.exId] || maxSet.kg > map[e.exId].kg) map[e.exId] = maxSet;
  }));
  return map;
}
async function calcularUltimaSesionPorEjercicio(exIds){
  const sesiones = await cargarSesiones();
  const map = {};
  for(const exId of exIds){
    for(const s of sesiones){
      const e = (s.ejercicios||[]).find(x=>x.exId===exId);
      if(e && e.sets && e.sets.length){ map[exId] = e.sets; break; }
    }
  }
  return map;
}
async function iniciarEntrenamiento(rutina, diaIdx){
  const dia = rutina.dias[diaIdx];
  if(!dia || dia.ejercicios.length===0){ showToast('Ese día no tiene ejercicios cargados', 'error'); return; }
  const exIds = dia.ejercicios.map(e=>e.exId);
  const [historialPrevio, ultimaSesion] = await Promise.all([calcularHistorialPrevio(exIds), calcularUltimaSesionPorEjercicio(exIds)]);
  sessionState = { rutinaNombre: rutina.nombre, diaNombre: dia.nombre, inicio: Date.now(), descansoSeg:90, descansoRestante:0, descansoInterval:null, idx:0, historialPrevio, ultimaSesion,
    ejercicios: dia.ejercicios.map(ex=>{ const info=EJERCICIOS.find(e=>e.id===ex.exId); return {exId:ex.exId, nombre: info?info.nombre:ex.exId, target: ex.target, sets:[], notas:''}; }) };
  currentTab='entrenar'; ejercicioAbierto=null; mostrandoPickerWorkout=false;
  await render();
  showToast(`Arrancó: ${dia.nombre} 💪`, 'success');
}

async function finalizarEntrenamiento(){
  if(sessionState.descansoInterval) clearInterval(sessionState.descansoInterval);
  const duracionMin = Math.max(1, Math.round((Date.now()-sessionState.inicio)/60000));
  const ejerciciosConSets = sessionState.ejercicios.filter(e=>e.sets.length>0);
  if(ejerciciosConSets.length===0){ showToast('No cargaste ninguna serie', 'error'); return; }
  let volumenTotal = 0; const prsNuevos=[];
  ejerciciosConSets.forEach(e=>{
    const maxSetHoy = e.sets.reduce((m,s)=> (s.kg*s.reps > m.kg*m.reps? s : m), {kg:0,reps:0});
    volumenTotal += e.sets.reduce((s,set)=>s+set.kg*set.reps,0);
    const previo = sessionState.historialPrevio[e.exId];
    if(!previo || maxSetHoy.kg > previo.kg){ prsNuevos.push(`${e.nombre} ${maxSetHoy.kg}kg×${maxSetHoy.reps}`); }
  });
  const sesion = {fecha: today, rutinaNombre: sessionState.rutinaNombre, diaNombre: sessionState.diaNombre, duracionMin, volumenTotal, ejercicios: ejerciciosConSets};
  await setKey('sesion:'+Date.now(), sesion);
  sessionState = null; entrenarSubtab='historial';
  await render();
  if(prsNuevos.length) showToast('🏆 Nuevo PR: '+prsNuevos.join(' · '), 'success'); else showToast('Entrenamiento guardado 💪', 'success');
}

    <div class="card accent"><h3>Peso de hoy</h3><div class="row"><input type="number" step="0.1" id="pesoHoyInput" placeholder="kg" value="${dia.peso||''}"><button class="btn-primary btn-icon" id="guardarPesoHoy">Guardar</button></div></div>
    <div class="grid3">
      <div class="card"><h3>Entrenos</h3><div class="bignum" style="font-size:20px;">${totalEntrenamientos}</div></div>
      <div class="card"><h3>Racha</h3><div class="bignum" style="font-size:20px;">🔥${racha}</div></div>
      <div class="card"><h3>Cambio</h3><div class="bignum" style="font-size:20px; color:${diff<0?'var(--success)':diff>0?'var(--danger)':'var(--text)'};">${diff>0?'+':''}${perfil.unidad==='lb'?kgToLb(diff):diff.toFixed(1)}</div></div>
    </div>
    <div class="card"><h3>Resumen de peso</h3><div class="grid2"><div><div class="bar-label"><span>Inicial</span></div><div class="bignum" style="font-size:22px;">${fmtPeso(perfil.peso_inicial)}</div></div><div><div class="bar-label"><span>Actual</span></div><div class="bignum" style="font-size:22px;">${fmtPeso(actual)}</div></div></div></div>
    <div class="card">
      <div class="card-head"><h3>Evolución</h3></div>
      <div class="chips">${filtros.map(f=>`<div class="chip ${filtroTiempoProgreso===f.id?'active':''}" data-filtro-tiempo="${f.id}">${f.l}</div>`).join('')}</div>
      ${chartSvg}
    </div>
  `;
}

// ============ PERFIL ============
async function renderPerfil(){
  return `
    <div class="card"><h3>Tu perfil</h3>
      <label>Nombre</label><input type="text" id="perfNombre" value="${perfil.nombre||''}">
      <div class="grid2">
        <div><label>Altura (cm)</label><input type="number" id="perfAltura" value="${perfil.altura}"></div>
        <div><label>Edad</label><input type="number" id="perfEdad" value="${perfil.edad}"></div>
      </div>
    </div>
    <div class="card"><h3>Objetivo nutricional</h3>
      <div class="grid2">
        <div><label>Kcal objetivo</label><input type="number" id="perfKcal" value="${perfil.kcal}"></div>
        <div><label>Proteína (g)</label><input type="number" id="perfProt" value="${perfil.prot}"></div>
        <div><label>Carbos (g)</label><input type="number" id="perfCarb" value="${perfil.carb}"></div>
        <div><label>Grasa (g)</label><input type="number" id="perfGrasa" value="${perfil.grasa}"></div>
      </div>
      <button class="btn-primary" id="guardarPerfil">Guardar cambios</button>
    </div>
    <div class="card"><h3>Preferencias</h3>
      <button class="btn-ghost" style="width:100%; margin-bottom:8px;" id="toggleTema">Cambiar a modo ${tema==='dark'?'claro':'oscuro'}</button>
      <button class="btn-ghost" style="width:100%;" id="toggleUnidad">Unidad de peso: ${perfil.unidad==='lb'?'lb (cambiar a kg)':'kg (cambiar a lb)'}</button>
    </div>
    <div class="card"><h3>Favoritos</h3>
      ${favoritos.length===0 ? '<div class="empty">Todavía no marcaste favoritos</div>' :
        favoritos.map(id=>{const e=EJERCICIOS.find(x=>x.id===id); return e?`<div class="ex-card" data-abrir-ejercicio-perfil="${e.id}"><div class="ex-info"><div class="ex-name">${e.nombre}</div><div class="ex-meta">${e.grupo}</div></div></div>`:'';}).join('')}
    </div>
  `;
}

// ============ HANDLERS ============
function attachHandlers(){
  document.querySelectorAll('.navbtn').forEach(b=>{ b.onclick = ()=>{ currentTab=b.dataset.tab; ejercicioAbierto=null; render(); }; });

  const togglePreviaHoy = document.getElementById('togglePreviaHoy');
  if(togglePreviaHoy) togglePreviaHoy.onclick = ()=>{ mostrarPreviaEntrenoHoy = !mostrarPreviaEntrenoHoy; render(); };
  const ctaCrearRutina = document.getElementById('ctaCrearRutina');
  if(ctaCrearRutina) ctaCrearRutina.onclick = ()=>{ currentTab='entrenar'; entrenarSubtab='rutina'; construyendoRutina = {id:'rut_'+Date.now(), nombre:'', dias:[]}; render(); };
  const ctaCargarPeso = document.getElementById('ctaCargarPeso');
  if(ctaCargarPeso) ctaCargarPeso.onclick = ()=>{ const inp = document.getElementById('pesoHoyInput'); if(inp) inp.focus(); };

  document.querySelectorAll('[data-entrenar-sub]').forEach(b=>{ b.onclick = ()=>{ entrenarSubtab=b.dataset.entrenarSub; render(); }; });

  const buscarEjercicio = document.getElementById('buscarEjercicio');
  if(buscarEjercicio){ buscarEjercicio.oninput = (e)=>{ busquedaEjercicio = e.target.value; }; buscarEjercicio.addEventListener('keydown', e=>{ if(e.key==='Enter'){ render(); } }); buscarEjercicio.addEventListener('blur', ()=> render()); }
  document.querySelectorAll('[data-grupo]').forEach(c=>{ c.onclick = ()=>{ filtroGrupo = c.dataset.grupo; render(); }; });

  document.querySelectorAll('[data-abrir-ejercicio]').forEach(c=>{ c.onclick = ()=>{ ejercicioAbierto = c.dataset.abrirEjercicio; render().then(()=>cargarGifDetalle(ejercicioAbierto)); }; });
  document.querySelectorAll('[data-abrir-ejercicio-perfil]').forEach(c=>{ c.onclick = ()=>{ currentTab='entrenar'; entrenarSubtab='biblioteca'; ejercicioAbierto = c.dataset.abrirEjercicioPerfil; render().then(()=>cargarGifDetalle(ejercicioAbierto)); }; });
  const volverBiblioteca = document.getElementById('volverBiblioteca');
  if(volverBiblioteca) volverBiblioteca.onclick = ()=>{ ejercicioAbierto=null; render(); };
  document.querySelectorAll('[data-fav]').forEach(b=>{ b.onclick = async (ev)=>{ ev.stopPropagation(); await toggleFavorito(b.dataset.fav); render().then(()=>{ if(ejercicioAbierto) cargarGifDetalle(ejercicioAbierto); }); }; });

  // Rutinas
  const nuevaRutina = document.getElementById('nuevaRutina');
  if(nuevaRutina) nuevaRutina.onclick = ()=>{ construyendoRutina = {id:'rut_'+Date.now(), nombre:'', dias:[]}; render(); };
  const toggleGenerador = document.getElementById('toggleGenerador');
  if(toggleGenerador) toggleGenerador.onclick = ()=>{ mostrandoGenerador = !mostrandoGenerador; render(); };
  const confirmarGenerar = document.getElementById('confirmarGenerar');
  if(confirmarGenerar) confirmarGenerar.onclick = async ()=>{
    const opts = { dias: parseInt(document.getElementById('genDias').value), objetivo: document.getElementById('genObjetivo').value, nivel: document.getElementById('genNivel').value, duracion: parseInt(document.getElementById('genDuracion').value), prioridad: document.getElementById('genPrioridad').value };
    const nueva = generarRutina(opts);
    const rutinas = (await getKey('rutinas')) || []; rutinas.push(nueva); await setKey('rutinas', rutinas);
    mostrandoGenerador = false; render(); showToast('Rutina generada ✓', 'success');
  };
  document.querySelectorAll('[data-usar-plantilla]').forEach(b=>{ b.onclick = async ()=>{
    const p = PLANTILLAS.find(x=>x.id===b.dataset.usarPlantilla); const clone = JSON.parse(JSON.stringify(p)); clone.id = 'rut_'+Date.now();
    const rutinas = (await getKey('rutinas')) || []; rutinas.push(clone); await setKey('rutinas', rutinas); render(); showToast('Plantilla agregada a tus rutinas', 'success');
  }; });
  document.querySelectorAll('[data-editar-rutina]').forEach(b=>{ b.onclick = async ()=>{
    const rutinas = (await getKey('rutinas')) || []; const r = rutinas.find(x=>x.id===b.dataset.editarRutina);
    if(r){ construyendoRutina = JSON.parse(JSON.stringify(r)); construyendoRutina.editId = r.id; render(); }
  }; });
  document.querySelectorAll('[data-duplicar-rutina]').forEach(b=>{ b.onclick = async ()=>{
    const rutinas = (await getKey('rutinas')) || []; const r = rutinas.find(x=>x.id===b.dataset.duplicarRutina);
    if(r){ const clone = JSON.parse(JSON.stringify(r)); clone.id = 'rut_'+Date.now(); clone.nombre = clone.nombre + ' (copia)'; rutinas.push(clone); await setKey('rutinas', rutinas); render(); showToast('Rutina duplicada', 'success'); }
  }; });
  document.querySelectorAll('[data-eliminar-rutina]').forEach(b=>{ b.onclick = async ()=>{
    if(!confirm('¿Eliminar esta rutina? No se puede deshacer.')) return;
    const rutinas = (await getKey('rutinas')) || []; await setKey('rutinas', rutinas.filter(r=>r.id!==b.dataset.eliminarRutina)); render(); showToast('Rutina eliminada', 'info');
  }; });
  document.querySelectorAll('[data-empezar]').forEach(b=>{ b.onclick = async ()=>{
    const [rid, diIdx] = b.dataset.empezar.split(':'); const rutinas = (await getKey('rutinas')) || []; const rutina = rutinas.find(r=>r.id===rid);
    if(rutina) await iniciarEntrenamiento(rutina, parseInt(diIdx));
  }; });

  // Builder
  const cancelarBuilder = document.getElementById('cancelarBuilder');
  if(cancelarBuilder) cancelarBuilder.onclick = ()=>{ construyendoRutina = null; render(); };
  const nombreRutinaInput = document.getElementById('nombreRutinaInput');
  if(nombreRutinaInput) nombreRutinaInput.oninput = (e)=>{ construyendoRutina.nombre = e.target.value; };
  document.querySelectorAll('[data-dia-nombre]').forEach(inp=>{ inp.oninput = (e)=>{ construyendoRutina.dias[+inp.dataset.diaNombre].nombre = e.target.value; }; });
  document.querySelectorAll('[data-eliminar-dia]').forEach(b=>{ b.onclick = ()=>{ construyendoRutina.dias.splice(+b.dataset.eliminarDia,1); render(); }; });
  document.querySelectorAll('[data-target-dia]').forEach(inp=>{ inp.oninput = (e)=>{ construyendoRutina.dias[+inp.dataset.targetDia].ejercicios[+inp.dataset.targetEx].target = e.target.value; }; });
  document.querySelectorAll('[data-mover]').forEach(b=>{ b.onclick = ()=>{
    const [di,ei,dir] = b.dataset.mover.split(':').map(Number); const arr = construyendoRutina.dias[di].ejercicios; const nuevo = ei+dir;
    if(nuevo<0 || nuevo>=arr.length) return; [arr[ei],arr[nuevo]] = [arr[nuevo],arr[ei]]; render();
  }; });
  document.querySelectorAll('[data-quitar-ex]').forEach(b=>{ b.onclick = ()=>{ const [di,ei] = b.dataset.quitarEx.split(':').map(Number); construyendoRutina.dias[di].ejercicios.splice(ei,1); render(); }; });
  document.querySelectorAll('[data-agregar-ex-dia]').forEach(b=>{ b.onclick = ()=>{ pickerParaDia = +b.dataset.agregarExDia; render(); }; });
  document.querySelectorAll('[data-swap-similar]').forEach(b=>{ b.onclick = ()=>{ const [di,ei] = b.dataset.swapSimilar.split(':').map(Number); swapContext = {modo:'builder', di, ei}; render(); }; });
  const agregarDia = document.getElementById('agregarDia');
  if(agregarDia) agregarDia.onclick = ()=>{ construyendoRutina.dias.push({nombre:'Día '+(construyendoRutina.dias.length+1), ejercicios:[]}); render(); };
  const guardarRutina = document.getElementById('guardarRutina');
  if(guardarRutina) guardarRutina.onclick = async ()=>{
    if(!construyendoRutina.nombre.trim()){ showToast('Ponele un nombre a la rutina', 'error'); return; }
    if(construyendoRutina.dias.length===0 || construyendoRutina.dias.every(d=>d.ejercicios.length===0)){ showToast('Agregá al menos un ejercicio', 'error'); return; }
    const rutinas = (await getKey('rutinas')) || [];
    if(construyendoRutina.editId){
      const idx = rutinas.findIndex(r=>r.id===construyendoRutina.editId);
      const { editId, ...limpio } = construyendoRutina;
      if(idx>=0) rutinas[idx] = {...limpio, id: editId}; else rutinas.push({...limpio, id: editId});
    } else { rutinas.push(construyendoRutina); }
    await setKey('rutinas', rutinas);
    construyendoRutina = null; render(); showToast('Rutina guardada ✓', 'success');
  };
  const cerrarPicker = document.getElementById('cerrarPicker');
  if(cerrarPicker) cerrarPicker.onclick = ()=>{ pickerParaDia = null; mostrandoPickerWorkout = false; mostrandoPickerBuilderSwap = false; swapContext = null; render(); };
  document.querySelectorAll('[data-pick-ejercicio]').forEach(c=>{ c.onclick = ()=> aplicarSeleccionEjercicio(c.dataset.pickEjercicio); });

  // Similares (cambiar por ejercicio equivalente)
  const cerrarSimilares = document.getElementById('cerrarSimilares');
  if(cerrarSimilares) cerrarSimilares.onclick = ()=>{ swapContext = null; render(); };
  document.querySelectorAll('[data-pick-similar]').forEach(c=>{ c.onclick = ()=> aplicarSeleccionEjercicio(c.dataset.pickSimilar); });
  const verTodaBiblioteca = document.getElementById('verTodaBiblioteca');
  if(verTodaBiblioteca) verTodaBiblioteca.onclick = ()=>{
    if(swapContext && swapContext.modo==='workout') mostrandoPickerWorkout = true;
    else if(swapContext && swapContext.modo==='builder') mostrandoPickerBuilderSwap = true;
    render();
  };

  // Modo entrenamiento
  const copiarAnterior = document.getElementById('copiarAnterior');
  if(copiarAnterior) copiarAnterior.onclick = ()=>{
    const ex = sessionState.ejercicios[sessionState.idx]; const prev = sessionState.ultimaSesion[ex.exId]; const s = prev && prev[ex.sets.length];
    if(s){ document.getElementById('setKg').value = s.kg; document.getElementById('setReps').value = s.reps; if(s.rir!=null) document.getElementById('setRir').value = s.rir; }
  };
  const reemplazarEjercicio = document.getElementById('reemplazarEjercicio');
  if(reemplazarEjercicio) reemplazarEjercicio.onclick = ()=>{ swapContext = {modo:'workout'}; mostrandoPickerWorkout = false; render(); };
  const notasEjercicio = document.getElementById('notasEjercicio');
  if(notasEjercicio) notasEjercicio.oninput = (e)=>{ sessionState.ejercicios[sessionState.idx].notas = e.target.value; };
  const completarSerie = document.getElementById('completarSerie');
  if(completarSerie) completarSerie.onclick = ()=>{
    const kg = parseFloat(document.getElementById('setKg').value) || 0;
    const reps = parseInt(document.getElementById('setReps').value) || 0;
    const rirVal = document.getElementById('setRir').value;
    const rir = rirVal===''? null : parseInt(rirVal);
    if(reps<=0){ showToast('Ingresá las repeticiones', 'error'); return; }
    if(kg<0){ showToast('El peso no puede ser negativo', 'error'); return; }
    sessionState.ejercicios[sessionState.idx].sets.push({kg,reps,rir});
    iniciarDescanso(sessionState.descansoSeg || 90);
    render();
  };
  document.querySelectorAll('[data-descanso]').forEach(b=>{ b.onclick = ()=>{ iniciarDescanso(parseInt(b.dataset.descanso)); }; });
  const exAnterior = document.getElementById('exAnterior');
  if(exAnterior) exAnterior.onclick = ()=>{ if(sessionState.idx>0){ sessionState.idx--; render(); } };
  const exSiguiente = document.getElementById('exSiguiente');
  if(exSiguiente) exSiguiente.onclick = ()=>{ if(sessionState.idx < sessionState.ejercicios.length-1){ sessionState.idx++; render(); } };
  const finalizarEntreno = document.getElementById('finalizarEntreno');
  if(finalizarEntreno) finalizarEntreno.onclick = ()=> finalizarEntrenamiento();

  // Historial
  document.querySelectorAll('[data-toggle-sesion]').forEach(el=>{ el.onclick = ()=>{ const i = +el.dataset.toggleSesion; sesionAbiertaIdx = sesionAbiertaIdx===i? null : i; render(); }; });

  // Nutrición
  const categoriaSelect = document.getElementById('categoriaSelect');
  if(categoriaSelect) categoriaSelect.onchange = (e)=>{ categoriaSeleccionActual = e.target.value; };
  const guardarPesoHoy = document.getElementById('guardarPesoHoy');
  if(guardarPesoHoy) guardarPesoHoy.onclick = async ()=>{
    const v = parseFloat(document.getElementById('pesoHoyInput').value);
    if(!v || v<=0 || v>350){ showToast('Ingresá un peso válido', 'error'); return; }
    const dia = await loadDia(today); dia.peso = v; await saveDia(today, dia); render(); showToast('Peso guardado ✓', 'success');
  };
  document.querySelectorAll('[data-del-comida]').forEach(b=>{ b.onclick = async ()=>{ const dia = await loadDia(today); dia.comidas.splice(+b.dataset.delComida,1); await saveDia(today, dia); render(); }; });
  const buscarBtn = document.getElementById('buscarBtn');
  if(buscarBtn) buscarBtn.onclick = ()=>{ const q = document.getElementById('buscarInput').value.trim(); if(q) buscarAlimento(q); };
  const buscarInput = document.getElementById('buscarInput');
  if(buscarInput) buscarInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); buscarBtn.click(); } });
  const barcodeBtn = document.getElementById('barcodeBtn');
  if(barcodeBtn) barcodeBtn.onclick = ()=>{ const c = document.getElementById('barcodeInput').value.trim(); if(c) buscarPorCodigoBarras(c); };
  const manAgregar = document.getElementById('manAgregar');
  if(manAgregar) manAgregar.onclick = async ()=>{
    const nombre = document.getElementById('manNombre').value.trim();
    const kcal = parseFloat(document.getElementById('manKcal').value)||0;
    const prot = parseFloat(document.getElementById('manProt').value)||0;
    const carb = parseFloat(document.getElementById('manCarb').value)||0;
    const grasa = parseFloat(document.getElementById('manGrasa').value)||0;
    if(!nombre){ showToast('Ponele un nombre al alimento', 'error'); return; }
    if(kcal<=0){ showToast('Las calorías deben ser mayores a 0', 'error'); return; }
    if(prot<0||carb<0||grasa<0){ showToast('Los macros no pueden ser negativos', 'error'); return; }
    const dia = await loadDia(today); dia.comidas.push({nombre,kcal,prot,carb,grasa,categoria:categoriaSeleccionActual}); await saveDia(today, dia); render(); showToast('Agregado ✓', 'success');
  };

  // Progreso
  document.querySelectorAll('[data-filtro-tiempo]').forEach(c=>{ c.onclick = ()=>{ filtroTiempoProgreso = c.dataset.filtroTiempo; render(); }; });

  // Perfil
  const guardarPerfil = document.getElementById('guardarPerfil');
  if(guardarPerfil) guardarPerfil.onclick = async ()=>{
    const kcal = parseFloat(document.getElementById('perfKcal').value);
    const prot = parseFloat(document.getElementById('perfProt').value);
    const carb = parseFloat(document.getElementById('perfCarb').value);
    const grasa = parseFloat(document.getElementById('perfGrasa').value);
    if([kcal,prot,carb,grasa].some(v=>isNaN(v)||v<=0)){ showToast('Todos los valores deben ser mayores a 0', 'error'); return; }
    perfil.nombre = document.getElementById('perfNombre').value.trim() || perfil.nombre;
    perfil.altura = parseFloat(document.getElementById('perfAltura').value)||perfil.altura;
    perfil.edad = parseFloat(document.getElementById('perfEdad').value)||perfil.edad;
    perfil.kcal = kcal; perfil.prot = prot; perfil.carb = carb; perfil.grasa = grasa;
    await setKey('perfil', perfil); render(); showToast('Perfil actualizado ✓', 'success');
  };
  const toggleTema = document.getElementById('toggleTema');
  if(toggleTema) toggleTema.onclick = async ()=>{ tema = tema==='dark' ? 'light' : 'dark'; document.body.dataset.theme = tema; await setKey('tema', tema); render(); };
  const toggleUnidad = document.getElementById('toggleUnidad');
  if(toggleUnidad) toggleUnidad.onclick = async ()=>{ perfil.unidad = perfil.unidad==='lb' ? 'kg' : 'lb'; await setKey('perfil', perfil); render(); };
}

async function cargarGifDetalle(id){
  const e = EJERCICIOS.find(x=>x.id===id); if(!e) return;
  const box = document.getElementById('gifBox'); if(!box) return;
  const url = await getExerciseGif(e.nombre);
  if(url){ box.innerHTML = `<img src="${url}" alt="${e.nombre}">`; }
  else { box.innerHTML = `<div class="placeholder">GIF no disponible todavía para este ejercicio.<br>Buscalo en YouTube: "${e.nombre}"</div>`; }
}

// ============ INIT ============
(async function init(){
  await loadPerfil();
  await loadFavoritos();
  tema = (await getKey('tema')) || 'dark';
  document.body.dataset.theme = tema;

  // Botones del timer flotante: se atan una sola vez porque el elemento es estático y nunca se destruye
  document.getElementById('ftMinus').addEventListener('click', ()=>{ if(!sessionState) return; sessionState.descansoRestante = Math.max(0, sessionState.descansoRestante-30); updateFloatingTimer(); });
  document.getElementById('ftPlus').addEventListener('click', ()=>{ if(!sessionState) return; sessionState.descansoRestante += 30; updateFloatingTimer(); });
  document.getElementById('ftSkip').addEventListener('click', ()=>{ if(!sessionState) return; sessionState.descansoRestante = 0; if(sessionState.descansoInterval) clearInterval(sessionState.descansoInterval); updateFloatingTimer(); });

  await render();
})();
</script>
</body>
</html>
